<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duelo Elemental">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Duelo Elemental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#141c26;--panel:#1f2a38;--panel2:#2b3a4e;--text:#f1f4f8;--muted:#9fb0c3;--acc:#ffc861}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141c26;--panel:#1f2a38;--panel2:#2b3a4e;--text:#f1f4f8;--muted:#9fb0c3;--acc:#ffc861}}
:root[data-theme="dark"]{--bg:#141c26;--panel:#1f2a38;--panel2:#2b3a4e;--text:#f1f4f8;--muted:#9fb0c3;--acc:#ffc861}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
/* barra de arriba en la arena */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.hbtn{flex:none;height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:var(--panel);font-weight:800;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.hbtn:active{transform:translateY(1px)}
#fighters{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0}
.fcard{background:var(--panel);border-radius:12px;padding:6px 8px;min-width:0;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.fcard.me{outline:2px solid var(--acc)}
.fcard .nm{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .el{font-size:12px;color:var(--muted);font-weight:700}
.hpb{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}.hpb i{display:block;height:100%;width:100%;background:#5ee08a;border-radius:4px;transition:width .2s}
.shb{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:3px}.shb i{display:block;height:100%;width:0;border-radius:2px}
.chip{flex:none;width:12px;height:12px;border-radius:3px;border:2px solid rgba(0,0,0,.45)}
/* aviso abajo */
#tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);transform:translateX(-50%);background:rgba(15,20,28,.85);padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;width:max-content;max-width:calc(100vw - 32px);text-align:center;transition:opacity .5s;pointer-events:none;opacity:0}
#tip.on{opacity:1}
/* elegir elemento */
#pick{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:radial-gradient(circle at 50% 35%,#24344a,var(--bg) 72%)}
#pick h1{margin:0;font-size:34px;letter-spacing:.5px;text-align:center}
#pick p{margin:0 0 8px;color:var(--muted);font-weight:700;font-size:16px}
.elgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px}
.elbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 12px;border-radius:18px;background:var(--panel);box-shadow:0 3px 0 rgba(0,0,0,.4);border:3px solid transparent}
.elbtn.last{border-color:var(--acc)}
.elbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.elbtn canvas{width:110px;height:110px}
.elbtn b{font-size:18px}
/* calibrar el sensor antes del conteo */
#calib{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:rgba(12,17,24,.72);text-align:center}
#calib h2{margin:0;font-size:24px}
#calib p{margin:0;color:var(--muted);font-weight:700;font-size:15px;max-width:300px}
#calHold{--p:0;width:150px;height:150px;border-radius:50%;padding:10px;background:conic-gradient(var(--acc) calc(var(--p)*1turn),rgba(255,255,255,.14) 0);touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.45)}
#calHold span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--panel);font-weight:900;font-size:17px;line-height:1.2}
#calHold.on span{background:var(--panel2)}
#calMsg{min-height:20px;color:var(--acc)!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <button class="hbtn" id="btnBack" aria-label="Volver">‹</button>
  <div id="fighters"></div>
  <button class="hbtn" id="btnCal">⟲ Centrar</button>
</div>
<div id="tip"></div>
<div id="calib" hidden>
  <h2>Calibra tu sensor</h2>
  <p>Sostén el teléfono como vas a jugar y mantén presionado el botón sin moverlo.</p>
  <button id="calHold"><span>Mantén<br>presionado</span></button>
  <p id="calMsg"></p>
</div>
<div id="pick">
  <h1>Duelo Elemental</h1>
  <p>Elige tu elemento</p>
  <div class="elgrid" id="elGrid"></div>
</div>
<script>
'use strict';
// ============================================================================
// DUELO ELEMENTAL — juego aparte de Monster Brawl (su propio guardado, caché y web app).
// Arena vista desde arriba como en Monster Brawl (2.5D: el suelo comprimido con DEPTH) y personajes con la misma física de resortes.
// ============================================================================
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
let ARENA_W = 520, ARENA_D = 600;      // suelo (unidades de arena); ARENA_D se ajusta al alto de la pantalla
const DEPTH = 0.7;                     // compresión de profundidad (igual que Monster Brawl)
const TOP = 130;                       // muro del fondo sobre el suelo
const RIG_STIFF = 1.3, RIG_DAMP = 1.5; // misma física de resortes que Monster Brawl
const SAVE_KEY = 'duelo_elemental_v1'; // (Monster Brawl usa monster_brawl_*: no se pisan)
const WALK_SPEED = 150;                // velocidad máxima caminando (unidades/s)
const TILT_DEAD = 2.5, TILT_FULL = 20; // grados: zona muerta y grados para ir a toda velocidad
const CAL_S = 1.5, CAL_MOVE = 6;       // calibrar: segundos manteniendo presionado y grados que se puede mover sin que se reinicie
const COUNT_S = 3, GO_S = 0.8;         // conteo 3, 2, 1 y «¡PELEA!»

// Elementos: color de la túnica de cada uno
const ELEM = {
  agua:   { n: 'Agua',   robe: '#2c7fd4', dark: '#1b528f', trim: '#bfe6ff', pants: '#1d3550' },
  tierra: { n: 'Tierra', robe: '#3d9446', dark: '#25652c', trim: '#e0c98e', pants: '#3b3020' },
  fuego:  { n: 'Fuego',  robe: '#d23a2c', dark: '#8f2017', trim: '#ffcf6e', pants: '#3a1a16' },
  aire:   { n: 'Aire',   robe: '#eea12a', dark: '#b77510', trim: '#fff1cf', pants: '#5a3d1a' },
};
const EL_KEYS = ['agua', 'tierra', 'fuego', 'aire'];
const SKINS = ['#f2d0b0', '#e4b48c', '#c98d62', '#a56b43', '#7a4a2c'];
// Medidas del cuerpo (humanoides chicos, todo rectangular)
const BODY = { legU: 14, legL: 14, legW: 7.5, hipX: 5.5, torW: 23, torH: 27, head: 18, armU: 12.5, armF: 12, armW: 6.5 };
const OL = '#141019'; // contorno
// Posición de combate (pedido del dueño): levemente agachado, piernas abiertas y flectadas, codos levemente abiertos y puños hacia adelante con el brazo doblado
const STANCE = { crouch: 0.17, feet: 7, knee: 4.5, kneeFwd: 3, stagger: 4, elbowX: 4.5, elbowY: -1.5, fistIn: 4.5, fistFwd: 6, fistUpF: -14.7, fistUpB: -8.8, fistF: 1.3, fistB: 0.85 };
const TOR_D = 0.6;  // grosor del torso respecto de su ancho (de perfil se ve así de angosto)
const ARM_GAIN = 0.45, ARM_MAX = 2.0; // brazos con el dedo: cuánto se mueve la mano por cada punto que mueves el dedo y hasta cuántas veces el largo del brazo se estira
const TAP_MOVE = 14;  // px: si el dedo se mueve menos que esto es un toque (salta); si se mueve más, mueve el brazo
const JUMP = { min: 230, max: 520, t0: 0.06, t1: 0.45, g: 1100 }; // salto: toque rápido = salto corto, un poco más largo = más fuerte (hasta t1 s)
const JOY_R = 44;     // palanca para caminar (sólo en el link de prueba, donde no llega la inclinación)
const TURN = 5;
// Tomar el elemento (pedido del dueño): tocar un pozo o una llama y arrastrar saca una esfera de agua o una bola de fuego, sólo si eres de ese elemento
const ORB = { r: 11, k: 170, z: 0.6, fall: 520, fade: 0.55 }; // tamaño, resorte que la lleva hacia tu dedo, gravedad del agua al soltarla, cuánto tarda en deshacerse
const PROP_EL = { water: 'agua', fire: 'fuego' };
// Escudo (pedido del dueño): mantener presionado tu pozo o tu llama trae una corriente que te rodea como una esfera; el daño que recibes baja según cuánto elemento tienes alrededor
const STREAM = { hold: 0.35, rate: 38, t: 0.75, per: 0.014, decay: 0.035 }; // espera antes de que empiece, gotas/llamas por segundo, segundos que tardan en llegar, escudo que suma cada una, cuánto se gasta solo por segundo
const SHIELD = { r: 34, block: 0.75, wear: 0.03 }; // radio, cuánto daño quita con el escudo lleno (75%), cuánto se gasta por cada punto de daño
// Lanzar la esfera: si la sueltas moviéndola rápido sale disparada y daña al que golpea
const THROW = { min: 260, max: 1000, dmg: 14, life: 1.4, kb: 260 }; // velocidad mínima para lanzarla y máxima, daño (la rapidez no lo cambia, pedido del dueño), segundos que vuela, empujón
const HP_MAX = 100, KO_S = 2.6;
// Guardar la esfera (pedido del dueño): llevarla a tu personaje y dejarla ahí un momento hace que quede flotando cerca de él; un deslizamiento rápido hacia adelante la dispara al rival
const DOCK = { r: 30, s: 0.5, max: 3, orbX: 40, orbY: 13, fire: 760, fwd: Math.PI / 3 }; // radio del anillo de carga, segundos que la esfera tiene que tocar tu personaje, cuántas puede guardar (3), radio de la órbita a lo ancho y hacia el fondo, velocidad del disparo, cuánto puede desviarse el deslizamiento de "hacia el rival" (60°)
// Salpicadura (pedido del dueño): arrastrar desde tu pozo o tu llama y soltar pronto (antes de `quick` s) lanza una salpicadura del elemento en esa dirección (no se controla después); también daña. Si sigues arrastrando, sale la esfera
const SPLASH = { quick: 0.3, decide: 30, v: 900, n: 26, spread: 0.32, sp0: 540, spK: 0.15, life: 0.62, dmg: 12 }; // px que hay que arrastrar, rapidez (px/s) del deslizamiento que dispara la esfera guardada, gotas/llamas, abertura, velocidad, duración, daño (la rapidez no cambia el daño, pedido del dueño)
const ARM_RANGE = [-15 * Math.PI / 180, 85 * Math.PI / 180]; // rango cómodo de cada brazo (desde un poco cruzado por delante hasta un poco detrás del costado); fuera de él, el cuerpo gira
const REACH_BEND = 0.8; // al apuntar a un pozo, una llama o el elemento, la mano llega a este largo del brazo: el codo queda flectado (hacia atrás)
const LIMB = { k: 2.6, z: 0.55, mn: 0.9, mx: 1.06 }; // extremidades más rígidas (pedido del dueño): resortes más firmes y frenados, y los huesos casi no cambian de largo     // qué tan rápido gira para mirar al otro (transición gradual)

const load = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } };
const save = d => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { } };
const $ = id => document.getElementById(id);

// ============================================================================
// PERSONAJE
// ============================================================================
class Fighter {
  constructor(el, skin, name) {
    this.el = el; this.E = ELEM[el]; this.skin = skin; this.name = name;
    this.x = ARENA_W / 2; this.y = ARENA_D / 2; this.vx = 0; this.vy = 0; this.z = 0; this.r = 15;
    this.t = Math.random() * 10; this.walkPh = 0; this.s = 1; this.gx = 0; this.gy = 0;
    this.vz = 0; this.charge = 0; this.landK = 0; this.hp = HP_MAX; this.shield = 0; this.downK = 0;
    this.ph = 0; this.phT = 0; this.guard = 0; this.guardK = 0; // ph = hacia dónde mira (0 de frente, π/2 a la derecha, π de espaldas, −π/2 a la izquierda); guard = posición de combate
    this.buildRig();
  }
  // Esqueleto de nodos con resortes (como Monster Brawl): cada nodo sigue a su padre con un resorte amortiguado.
  // Los nodos de un lado del cuerpo guardan su lugar en el cuerpo (lat = hacia el lado, oy0 = altura) y se proyectan según hacia dónde mira (orient)
  buildRig() {
    const B = BODY, N = this.nodes = [], I = this.ix = {};
    const add = (p, ox, oy, k, z = 0.35) => { N.push({ p, ox, oy, ax: 0, ay: 0, k, c: 2 * z * Math.sqrt(k), x: 0, y: 0, vx: 0, vy: 0, len: Math.hypot(ox, oy), useT: false, tx: 0, ty: 0, boost: 1 }); return N.length - 1; };
    const side = (p, lat, oy, k, z) => { const i = add(p, lat, oy, k, z); N[i].lat = lat; N[i].oy0 = oy; return i; };
    I.root = add(-1, 0, 0, 0);                                   // cadera (base del torso)
    I.lower = add(I.root, 0, -B.torH * 0.35, 420, 0.4);
    I.upper = add(I.lower, 0, -B.torH * 0.5, 300, 0.3);         // pecho
    I.head = add(I.upper, 0, -(B.torH * 0.15 + B.head * 0.5 + 1.5), 150, 0.25);
    I.arms = [-1, 1].map(sd => {
      const lat = sd * (B.torW * 0.5 + B.armW * 0.15), sh = side(I.upper, lat, -B.torH * 0.08, 380, 0.35);
      const el = side(sh, sd * 2.5, B.armU, 160, 0.25), ha = side(el, sd * 1, B.armF, 120, 0.22);
      return { sd, sh, el, ha, lat };
    });
    I.legs = [-1, 1].map(sd => {
      const hip = side(I.root, sd * B.hipX, 1, 400, 0.4), knee = side(hip, sd * 1, B.legU, 220, 0.3), foot = add(knee, 0, B.legL, 240, 0.35);
      N[knee].useT = N[foot].useT = true; N[knee].leg = N[foot].leg = true;
      return { sd, hip, knee, foot, hx: sd * B.hipX, ph: sd > 0 ? Math.PI : 0 };
    });
    I.hem = [-1, 1].map(sd => { const i = add(I.root, sd * B.torW * 0.54, B.legU * 0.85, 70, 0.18); N[i].sil = sd; return i; }); // borde de la túnica: blando, se mece al caminar
    for (const i of [I.lower, I.upper, I.head]) N[i].ff = true; // torso y cabeza no se quedan atrás al caminar (si no, la cadera iba adelante y se veía inclinada la parte de abajo)
    for (const a of I.arms) for (const i of [a.el, a.ha]) N[i].limb = true;
    for (const L of I.legs) for (const i of [L.knee, L.foot]) N[i].limb = true;
    for (const n of N) if (n.limb) { const z = Math.max(LIMB.z, n.c / (2 * Math.sqrt(n.k))); n.k *= LIMB.k; n.c = 2 * z * Math.sqrt(n.k); }
    this.legSum = B.legU + B.legL;
    this.orient();
  }
  // Proyección de un punto del cuerpo (lat = hacia el costado, fwd = hacia adelante) según hacia dónde mira: x en pantalla y z hacia la cámara
  proj(lat, fwd) { const c = Math.cos(this.ph), sn = Math.sin(this.ph); return { x: lat * c + fwd * sn, z: -lat * sn + fwd * c }; }
  orient() { // al girar, hombros, caderas y codos rotan alrededor del cuerpo y el torso se angosta de perfil
    const c = Math.abs(Math.cos(this.ph)), sn = Math.abs(Math.sin(this.ph));
    for (const n of this.nodes) {
      if (n.lat != null) { const p = this.proj(n.lat, 0); n.ox = p.x; n.oy = n.oy0 + p.z * DEPTH; n.len = Math.hypot(n.ox, n.oy); }
      else if (n.sil) { n.ox = n.sil * (BODY.torW * c + BODY.torW * TOR_D * sn) * 0.54; n.len = Math.hypot(n.ox, n.oy); }
    }
  }
  rootTarget() { return { x: this.gx, y: this.gy - this.legSum * (0.93 - STANCE.crouch * (this.guardK || 0) - 0.14 * (this.charge || 0) - 0.16 * (this.landK || 0) - 0.42 * (this.downK || 0)) * this.s - this.z }; } // en guardia, levemente agachado; más al cargar el salto y al caer
  resetRig() {
    this.orient();
    const N = this.nodes, rt = this.rootTarget(); N[0].x = rt.x; N[0].y = rt.y;
    for (let i = 1; i < N.length; i++) { const n = N[i], P = N[n.p]; n.x = P.x + n.ox * this.s; n.y = P.y + n.oy * this.s; n.vx = n.vy = 0; }
  }
  animate(dt) {
    const N = this.nodes, I = this.ix, s = this.s; this.t += dt; const t = this.t;
    { let d = this.phT - this.ph; d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI; this.ph += d * Math.min(1, dt * TURN); this.orient(); } // gira poco a poco hacia donde debe mirar
    const c = Math.cos(this.ph), P2 = (lat, fwd, up) => { const p = this.proj(lat, fwd); return { x: p.x, y: up + p.z * DEPTH }; };
    const sp = Math.hypot(this.vx, this.vy), moving = clamp(sp / 50, 0, 1);
    this.walkPh += sp * 0.11 * dt;
    const lean = clamp(this.vx / 150, -1, 1);
    const want = clamp((this.wantVx ?? this.vx) / 150, -1, 1); this.leanU = (this.leanU || 0) + (want - (this.leanU || 0)) * Math.min(1, dt * 12); // el pecho se inclina primero, hacia donde quiere ir (pedido del dueño)
    const root = N[0], rt = this.rootTarget();
    const bob = Math.abs(Math.sin(this.walkPh)) * 2.5 * moving + Math.sin(t * 2.2) * 0.6;
    root.x = rt.x; root.y = rt.y - bob * s;
    N[I.lower].ax = -lean * 1.8; N[I.upper].ax = this.leanU * 4.5; N[I.upper].ay = Math.sin(t * 2) * 0.6 + Math.abs(this.leanU) * 0.8;
    const head = N[I.head]; head.ax = this.leanU * 2.2; head.ay = 0;
    this.guardK += (this.guard - this.guardK) * Math.min(1, dt * 5); // sube la guardia poco a poco
    const gk = this.guardK, fu = (c + 1) / 2;
    for (const a of I.arms) { // brazos: se balancean al caminar; en guardia, codos levemente abiertos y puños hacia adelante (hacia donde mira)
      const el = N[a.el], ha = N[a.ha], sw = Math.sin(this.walkPh + (a.sd > 0 ? 0 : Math.PI)) * moving * (1 - 0.6 * gk), idle = a.sd * Math.sin(t * 1.6) * (1 - 0.7 * gk);
      const e = P2(idle + a.sd * STANCE.elbowX * gk, sw * 4, STANCE.elbowY * gk);
      el.ax = e.x - lean * 2; el.ay = e.y;
      const h = P2(idle * 1.5 - a.sd * STANCE.fistIn * gk, sw * 6 + STANCE.fistFwd * gk, lerp(STANCE.fistUpB, STANCE.fistUpF, fu) * gk + Math.sin(t * 2.3 + a.sd) * 0.6 * gk);
      ha.ax = h.x - lean * 2; ha.ay = h.y;
      ha.useT = el.useT = false; ha.boost = el.boost = 1; ha.stretch = el.stretch = 0; ha.free = el.free = false;
      if (a.ctl) { // brazo controlado con el dedo: la mano sigue al dedo (se estira si hace falta) y el codo se dobla hacia afuera
        const sh = N[a.sh], L = (BODY.armU + BODY.armF) * s; let dx = a.ctl.abs ? a.ctl.x - sh.x : a.ctl.rx + a.ctl.dx, dy = a.ctl.abs ? a.ctl.y - sh.y : a.ctl.ry + a.ctl.dy; const d = Math.hypot(dx, dy) || 1e-3, mxR = L * (a.ctl.abs ? REACH_BEND : ARM_MAX); if (d > mxR) { dx *= mxR / d; dy *= mxR / d; } // abs: la mano apunta a tu dedo (al tocar un pozo o una llama), sin estirarse, con el codo flectado
        ha.useT = true; ha.tx = sh.x + dx; ha.ty = sh.y + dy; ha.boost = 3; ha.stretch = el.stretch = a.ctl.abs ? 0 : ARM_MAX * 1.15;
        const dd = Math.min(d, mxR), l1 = el.len * s, l2 = ha.len * s, al = dd > 1e-3 ? (l1 * l1 - l2 * l2 + dd * dd) / (2 * dd) : 0, bend = Math.sqrt(Math.max(0, l1 * l1 - al * al)); const dl = Math.hypot(dx, dy) || 1e-3; let px = -dy / dl, py = dx / dl; // codo con el largo real de brazo y antebrazo

    } else { // suelta: el agua cae y salpica; el fuego sube un poco y se apaga

    const sp = Math.hypot(o.vx, o.vy); o.acc = (o.acc || 0) + dt * (o.k === 'fire' ? 18 : 2) + dt * sp / (o.k === 'water' ? 60 : 30); while (o.acc > 1) { o.acc--; orbFx(o, 1); }

}
function drawOrb(ctx, o, T) {

    ctx.fillStyle = g; ctx.strokeStyle = '#164d86'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(0, 0, r * st * (1 + wob), r / Math.sqrt(st) * (1 - wob), 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.rotate(-ang); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.28, r * 0.16, -0.6, 0, TAU); ctx.fill();

    ctx.globalCompositeOperation = 'lighter'; const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.6); gl.addColorStop(0, 'rgba(255,170,60,.55)'); gl.addColorStop(1, 'rgba(255,90,20,0)'); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, r * 2.6, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
    let tx = -o.vx * 0.06, ty = -o.vy * 0.06 - 14; const tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl, L = Math.min(r * 3.2, r * 1.4 + tl * 0.8);
    for (const [col, wk, lk] of [['#e2401c', 1, 1], ['#ff8a1f', 0.75, 0.8], ['#ffd25a', 0.5, 0.6]]) for (let k = -1; k <= 1; k++) {
      const fl = 1 + 0.2 * Math.sin(T * 13 + k * 2.1 + o.x), px = -uy, py = ux, w = r * 0.75 * wk, ll = L * lk * fl * (k ? 0.75 : 1), bx = px * k * r * 0.45, by = py * k * r * 0.45;
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(bx + px * w, by + py * w); ctx.quadraticCurveTo(bx + px * w + ux * ll * 0.5, by + py * w + uy * ll * 0.5, bx + ux * ll + Math.sin(T * 7 + k) * 2, by + uy * ll); ctx.quadraticCurveTo(bx - px * w + ux * ll * 0.5, by - py * w + uy * ll * 0.5, bx - px * w, by - py * w); ctx.arc(bx, by, w, Math.atan2(-py, -px), Math.atan2(py, px), true); ctx.fill(); }
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, '#fffbe6'); g.addColorStop(0.5, '#ffd25a'); g.addColorStop(1, '#ff7a1f'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * (0.85 + 0.06 * Math.sin(T * 17)), 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawFx(ctx) { for (const q of G.fx) { ctx.globalAlpha = clamp(q.life * 2.2, 0, 1); ctx.fillStyle = q.k === 'drop' ? '#7cc8f4' : q.life > 0.25 ? '#ffd25a' : '#ff6a1f'; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill(); } ctx.globalAlpha = 1; }
function drawDuel(ctx, V) {
  drawArena(ctx, V);
  const T = performance.now() / 1000, props = arenaProps();
  ctx.save(); ctx.beginPath(); ctx.rect(V.x0 - 20, TOP, V.x1 - V.x0 + 40, ARENA_D * DEPTH); ctx.clip(); // sólo sobre el suelo
  for (const p of props) if (p.k === 'water') drawPool(ctx, p, T); else drawFireGlow(ctx, p, T);
  for (const t of PTRS.values()) if (t.prop >= 0 && t.arm) { const p = props[t.prop], y = TOP + p.y * DEPTH - (p.k === 'water' ? 6 : FIRE_H), rr = p.r + 8 + 2 * Math.sin(T * 8); ctx.strokeStyle = p.k === 'water' ? 'rgba(190,235,255,.85)' : 'rgba(255,220,120,.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(p.x, y, rr, rr * DEPTH, 0, 0, TAU); ctx.stroke(); } // el pozo o la llama que tocas brilla
  ctx.restore();
  for (const m of G.ms) { const k = clamp(1 - m.z / 160, 0.45, 1); ctx.fillStyle = `rgba(30,20,10,${0.28 * k})`; ctx.beginPath(); ctx.ellipse(m.gx, m.gy, m.r * 1.15 * m.s * k, m.r * 0.42 * m.s * k, 0, 0, TAU); ctx.fill(); } // sombras (más chicas mientras más alto salta)
  for (const m of G.ms) if (m.isMe) { ctx.strokeStyle = 'rgba(255,200,97,.8)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(m.gx, m.gy, m.r * 1.4 * m.s, m.r * 0.5 * m.s, 0, 0, TAU); ctx.stroke(); } // anillo dorado: tú
  for (const q of G.dust) { ctx.fillStyle = `rgba(200,180,140,${q.life * 0.7})`; ctx.beginPath(); ctx.arc(q.x, TOP + q.y * DEPTH - q.z, q.r, 0, TAU); ctx.fill(); }
  for (const it of [...G.ms.map(m => ({ y: m.y, m })), ...props.filter(p => p.k === 'fire').map(p => ({ y: p.y, p }))].sort((a, b) => a.y - b.y)) it.m ? (G.orbs.forEach(o => { if (o.docked && o.owner === it.m && o.back) drawOrb(ctx, o, T); }), it.m.draw(ctx), G.orbs.forEach(o => { if (o.docked && o.owner === it.m && !o.back) drawOrb(ctx, o, T); }), drawShield(ctx, it.m, T)) : drawFire(ctx, it.p, T); // por profundidad (el fuego tapa o queda detrás de los personajes)
  for (const o of G.orbs) if (o.held && o.dockT > 0.02) { const m = G.me, c = m.nodes[m.ix.upper], f = Math.min(1, o.dockT / DOCK.s); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c.x, c.y + 4 * m.s, DOCK.r * m.s, 0, TAU); ctx.stroke(); ctx.strokeStyle = o.k === 'water' ? '#8fd3ff' : '#ffc861'; ctx.beginPath(); ctx.arc(c.x, c.y + 4 * m.s, DOCK.r * m.s, -Math.PI / 2, -Math.PI / 2 + f * TAU); ctx.stroke(); } // anillo que se llena mientras la dejas en tu personaje
  drawFlow(ctx); drawSplash(ctx); drawFx(ctx); for (const o of G.orbs) if (!o.docked) drawOrb(ctx, o, T); // el elemento que tomaste va por encima (las que orbitan, con su personaje)
  ctx.textAlign = 'center'; for (const t of G.texts) { ctx.globalAlpha = clamp(t.life * 2.5, 0, 1); ctx.font = `900 ${t.small ? 11 : 18}px system-ui, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,.85)'; ctx.strokeText(t.str, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.str, t.x, t.y); } ctx.globalAlpha = 1;

function drawBig(ctx, txt, f) { // letras grandes (K.O.)
  const sc = 1 + 0.6 * Math.pow(1 - Math.min(1, f * 5), 2), fs = Math.min(W * 0.24, H * 0.2) * sc;
  ctx.save(); ctx.translate(W / 2, H * 0.46); ctx.font = `900 ${fs}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = fs * 0.14; ctx.strokeStyle = '#141019'; ctx.strokeText(txt, 0, 0);
  const g = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, '#ffc861'); g.addColorStop(1, '#ff7a3a'); ctx.fillStyle = g; ctx.fillText(txt, 0, 0); ctx.restore();
}
function drawCount(ctx) { // 3, 2, 1, ¡PELEA! (cada número aparece grande y se achica)
  const left = G.cd - GO_S, txt = left > 0 ? String(Math.ceil(left)) : '¡PELEA!', f = left > 0 ? 1 - (left % 1 || 1) : 1 - G.cd / GO_S;
  const sc = 1 + 0.6 * Math.pow(1 - Math.min(1, f * 4), 2), fs = Math.min(W * (left > 0 ? 0.36 : 0.18), H * 0.22) * sc;

  ctx.font = `900 ${fs}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = fs * 0.14; ctx.strokeStyle = '#141019'; ctx.strokeText(txt, 0, 0);
  const g = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2); g.addColorStop(0, '#fff3c4'); g.addColorStop(0.5, '#ffc861'); g.addColorStop(1, '#ff7a3a'); ctx.fillStyle = g; ctx.fillText(txt, 0, 0);

  ctx.fillStyle = 'rgba(15,20,28,.55)'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, TAU); ctx.stroke();

// ============================================================================
// PANTALLA Y BUCLE
// ============================================================================
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SAB = 0;
function layout() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const probe = document.createElement('div'); probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px)'; document.body.appendChild(probe); SAB = probe.offsetHeight; probe.remove();
  if (scene === 'duel') { // en vertical la arena llena el alto que queda bajo la barra (como Monster Brawl)
    const top = $('hud').getBoundingClientRect().bottom + 6, avail = H - top - 12 - SAB, k = W / (ARENA_W + 40);
    ARENA_D = H / W > 1.25 ? clamp((avail / k - TOP - 24) / DEPTH, 420, 1400) : 560;
  }
}
addEventListener('resize', layout);
function view() {
  const top = $('hud').getBoundingClientRect().bottom + 6, bottom = 12 + SAB, bw = ARENA_W + 40, bh = TOP + ARENA_D * DEPTH + 24;
  const k = Math.min(W / bw, (H - top - bottom) / bh), ox = (W - ARENA_W * k) / 2, oy = top + Math.max(0, ((H - top - bottom) - bh * k) / 2);
  return { k, ox, oy, V: { x0: -ox / k, x1: (W - ox) / k, y0: -oy / k, y1: (H - oy) / k } };
}
let lastT = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(1 / 30, (now - lastT) / 1000); lastT = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#141c26'; ctx.fillRect(0, 0, W, H);
  if (scene === 'duel' && G) {
    duelStep(dt);
    const { k, ox, oy, V } = view();
    ctx.save(); ctx.translate(ox, oy); ctx.scale(k, k); drawDuel(ctx, V); ctx.restore();
    drawLevel(ctx, W, H);
    if (G.phase === 'count') drawCount(ctx);
    if (G.phase === 'ko') drawBig(ctx, '¡K.O.!', 1 - G.koT / KO_S);
    G.ms.forEach((m, i) => { const h = $('hp' + i), sh = $('sh' + i), hv = Math.round(m.hp / HP_MAX * 100), sv = Math.round(m.shield * 100); if (h && h.dataset.v != hv) { h.dataset.v = hv; h.style.width = hv + '%'; h.style.background = hv > 50 ? '#5ee08a' : hv > 25 ? '#ffc861' : '#ff5d6c'; } if (sh && sh.dataset.v != sv) { sh.dataset.v = sv; sh.style.width = sv + '%'; } }); // vida y escudo arriba
  }
}
function loop() { requestAnimationFrame(loop); try { frame(); } catch (e) { console.error(e); } } // el bucle nunca se detiene por un error

let tipT = 0;
function showTip(txt, ms) { const el = $('tip'); el.textContent = txt; el.classList.add('on'); clearTimeout(tipT); tipT = setTimeout(() => el.classList.remove('on'), ms); }

// ----- elegir elemento -----
function buildPick() {
  const last = load().el;
  $('elGrid').innerHTML = EL_KEYS.map(k => `<button class="elbtn${k === last ? ' last' : ''}" data-el="${k}"><canvas width="220" height="220"></canvas><b>${ELEM[k].n}</b></button>`).join('');
  for (const b of $('elGrid').querySelectorAll('.elbtn')) {
    const c = b.querySelector('canvas'), x = c.getContext('2d'), m = new Fighter(b.dataset.el, SKINS[1], '');
    m.s = 2.6; m.gx = 110; m.gy = 196; m.resetRig(); for (let i = 0; i < 40; i++) m.step(1 / 60);
    x.fillStyle = 'rgba(0,0,0,.25)'; x.beginPath(); x.ellipse(110, 196, 44, 13, 0, 0, TAU); x.fill(); m.draw(x);
    b.addEventListener('click', () => {
      // iPhone: pedir permiso para leer la inclinación (tiene que ser justo al tocar)
      try { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().catch(() => { }); } catch (e) { }
      startDuel(b.dataset.el);
    });
  }
}
$('btnBack').addEventListener('click', () => { clearTouches(); scene = 'pick'; G = null; calReset(''); $('calib').hidden = true; $('hud').hidden = true; $('pick').hidden = false; buildPick(); });
$('btnCal').addEventListener('click', () => { centerTilt(); showTip('Centrado', 1200); });

layout(); buildPick(); loop();
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) navigator.serviceWorker.register('sw.js').catch(() => { });
