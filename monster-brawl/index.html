    } else if (g.wings.type === 'feather') {
      const a0 = Math.atan2(uy, ux), sg = (ux * py - uy * px) > 0 ? 1 : -1;
      for (let i = 4; i >= 0; i--) {
        const len = L * (1 - i * 0.13);
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a0 + sg * i * 0.24);
        ctx.beginPath(); ctx.ellipse(len / 2, 0, len / 2, L * 0.11, 0, 0, TAU); fillStroke(ctx, i % 2 ? fill : C.wingL, C.ol, lw);
        ctx.restore();
      }
    } else if (g.wings.type === 'butterfly') { // mariposa: dos lóbulos con manchas
      const a0 = Math.atan2(uy, ux), sg = (ux * py - uy * px) > 0 ? 1 : -1;
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.save(); ctx.rotate(a0 - sg * 0.25); ctx.beginPath(); ctx.ellipse(L * 0.55, 0, L * 0.58, L * 0.36, 0, 0, TAU); fillStroke(ctx, fill, C.ol, lw);
      ctx.beginPath(); ctx.arc(L * 0.68, 0, L * 0.14, 0, TAU); fillStroke(ctx, C.accent, C.ol, lw * 0.6); ctx.beginPath(); ctx.arc(L * 0.68, 0, L * 0.06, 0, TAU); ctx.fillStyle = C.white; ctx.fill(); ctx.restore();
      ctx.save(); ctx.rotate(a0 + sg * 0.75); ctx.beginPath(); ctx.ellipse(L * 0.36, 0, L * 0.36, L * 0.22, 0, 0, TAU); fillStroke(ctx, C.wingL, C.ol, lw);
      ctx.beginPath(); ctx.arc(L * 0.42, 0, L * 0.08, 0, TAU); ctx.fillStyle = C.accent; ctx.fill(); ctx.restore();
      ctx.restore();
    } else if (g.wings.type === 'flame') { // de fuego: lenguas que titilan
      const fl = k => 1 + Math.sin(this.t * 17 + k * 1.9) * 0.12, P = (f, hh) => ({ x: b.x + dx * f + px * L * hh, y: b.y + dy * f + py * L * hh });
      for (const [col, sc] of [[hsl(g.pal.wing, 8, 0.9), 1], ['rgba(255,236,150,.9)', 0.55]]) {
        const a = P(1.05 * sc * fl(0), -0.08), m1 = P(0.55 * sc, 0.08), b2 = P(0.85 * sc * fl(1), 0.38 * sc), m2 = P(0.4 * sc, 0.32 * sc), c3 = P(0.55 * sc * fl(2), 0.62 * sc);
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(P(0.5 * sc, -0.18 * sc).x, P(0.5 * sc, -0.18 * sc).y, a.x, a.y);
        ctx.quadraticCurveTo(m1.x, m1.y, b2.x, b2.y); ctx.quadraticCurveTo(m2.x, m2.y, c3.x, c3.y); ctx.quadraticCurveTo(P(0.15, 0.3 * sc).x, P(0.15, 0.3 * sc).y, b.x, b.y);

      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(L * 0.5, -L * 0.34, L * 1.05, 0); ctx.quadraticCurveTo(L * 0.5, L * 0.34, 0, 0); fillStroke(ctx, fill, C.ol, lw);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); for (const f of [0.3, 0.5, 0.7]) { ctx.moveTo(L * f, 0); ctx.lineTo(L * (f + 0.15), -L * 0.14); ctx.moveTo(L * f, 0); ctx.lineTo(L * (f + 0.15), L * 0.14); }

    } else {
      const a0 = Math.atan2(uy, ux), sg = (ux * py - uy * px) > 0 ? 1 : -1;
      ctx.save(); ctx.globalAlpha *= 0.7;
      ctx.translate(b.x, b.y);
      ctx.save(); ctx.rotate(a0 + sg * 0.55); ctx.beginPath(); ctx.ellipse(L * 0.36, 0, L * 0.38, L * 0.15, 0, 0, TAU); fillStroke(ctx, C.wingL, C.ol, lw); ctx.restore();
      ctx.rotate(a0); ctx.beginPath(); ctx.ellipse(L * 0.5, 0, L * 0.55, L * 0.2, 0, 0, TAU); fillStroke(ctx, C.wingL, C.ol, lw);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.lineWidth = lw * 0.6; ctx.stroke();
      ctx.restore();
    }
  }

  drawTail(ctx, tl, C, lw) {
    const pts = tl.chain.map(i => this.nodes[i]), n = pts.length, th = this.g.tail.thick * this.s;
    const ws = pts.slice(0, -1).map((_, i) => th * (1 - 0.6 * i / (n - 1)));
    chain(ctx, pts, ws, this.g.tail.accent ? C.accent : C.body, C.ol, lw);
    const a = pts[n - 2], b = pts[n - 1], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;

      case 'fin': ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(uy, ux)); ctx.beginPath(); ctx.ellipse(th * 1.2, 0, th * 1.5, th * 0.8, 0, 0, TAU); fillStroke(ctx, C.accent, C.ol, lw); ctx.restore(); break;
      case 'heart': heartPath(ctx, b.x + ux * th * 0.8, b.y + uy * th * 0.8, th * 1.3); fillStroke(ctx, C.accent, C.ol, lw); break;
      case 'fork': for (const o of [-0.55, 0.55]) { const c = Math.cos(o), sn = Math.sin(o), vx = ux * c - uy * sn, vy = ux * sn + uy * c; hornPath(ctx, b.x, b.y, b.x + vx * th * 2.2, b.y + vy * th * 2.2, th * 0.8, o * 0.6); fillStroke(ctx, C.horn, C.ol, lw); } break;
      case 'stinger': { // aguijón con brillo que pulsa
        const tx = b.x + ux * th * 2.6, ty = b.y + uy * th * 2.6, pl = 0.5 + 0.5 * Math.sin(this.t * 5);
        ctx.fillStyle = hsl(this.g.pal.accent, 25, 0.25 + 0.3 * pl); ctx.beginPath(); ctx.arc(tx, ty, th * (0.9 + 0.5 * pl), 0, TAU); ctx.fill();
        hornPath(ctx, b.x, b.y, tx, ty, th * 1.1, 0.8); fillStroke(ctx, C.accent, C.ol, lw); break;
      }
      case 'tuft': for (let k = 0; k < 4; k++) { const a = Math.atan2(uy, ux) + (k - 1.5) * 0.5, rr = th * (1.1 + Math.sin(this.t * 6 + k) * 0.15); ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * th * 0.9, b.y + Math.sin(a) * th * 0.9, rr * 0.75, 0, TAU); fillStroke(ctx, k % 2 ? C.belly : C.bodyL, C.ol, lw * 0.7); } break;
      case 'flame': {
        const fl = 1 + Math.sin(this.t * 22) * 0.15;
        ctx.beginPath(); ctx.ellipse(b.x, b.y - th * fl, th * 1.1, th * 1.8 * fl, 0, 0, TAU); ctx.fillStyle = hsl(this.g.pal.accent, 10, 0.85); ctx.fill();
        ctx.beginPath(); ctx.ellipse(b.x, b.y - th * 0.6, th * 0.6, th * 1.1 * fl, 0, 0, TAU); ctx.fillStyle = 'rgba(255,240,170,.9)'; ctx.fill();
        break;
      }
    }

  drawPupil(ctx, x, y, r, C) {

      case 'bar': ctx.ellipse(x, y, r * 1.15, r * 0.34, 0, 0, TAU); break;
      case 'dot': ctx.arc(x, y, r * 0.5, 0, TAU); break;
      case 'ring': ctx.arc(x, y, r * 0.75, 0, TAU); ctx.lineWidth = r * 0.4; ctx.strokeStyle = C.pupil; ctx.stroke(); return;

      case 'diamond': ctx.moveTo(x, y - r * 1.15); ctx.lineTo(x + r * 0.8, y); ctx.lineTo(x, y + r * 1.15); ctx.lineTo(x - r * 0.8, y); ctx.closePath(); break;

}

// ============================================================================
// BATALLA
// ============================================================================
class Battle {
  constructor(ms, mode) {
    this.ms = ms; this.mode = mode; this.proj = []; this.parts = []; this.texts = [];
    this.time = 0; this.cine = null; this.rings = []; this.elim = []; this.ranking = null; this.over = false; this.endT = 0; this.reported = false; this.shake = 0; this.winTeam = null;
    this.player = ms.find(m => m.isPlayer); this.players = ms.filter(m => m.isPlayer);
    const P = mode === '1v1' ? [[0.22, 0.5], [0.78, 0.5]] : mode === '2v2' ? [[0.2, 0.3], [0.2, 0.72], [0.8, 0.3], [0.8, 0.72]] : [[0.2, 0.25], [0.8, 0.25], [0.2, 0.8], [0.8, 0.8]];
    ms.forEach((m, i) => {
      m.x = P[i][0] * ARENA_W; m.y = P[i][1] * ARENA_D;
      const dx = ARENA_W / 2 - m.x, dy = ARENA_D / 2 - m.y, d = Math.hypot(dx, dy) || 1; m.lockAx = { x: dx / d, y: dy / d };

  }
  place(m) { m.s = 0.82 + 0.28 * (m.y / ARENA_D); m.gx = m.x; m.gy = TOP + m.y * DEPTH; }

  text(m, str, col, big) { const h = m.nodes[m.ix.head]; this.texts.push({ x: m.gx + (Math.random() - 0.5) * 16, y: h.y - m.g.head.h * m.s * 0.6, str, col, life: 0.9, big }); }

  hit(a, t, pow, dir, kind) {
    const ot = this.time > OT_START ? 1 + (this.time - OT_START) / OT_RAMP : 1; // muerte súbita
    const allA = (a.buffs.all > 0 ? ULT_ALL_MUL : 1) * (a.tp.valor > 0.2 && a.hp / a.st.hp < a.scaredHp ? 1 + a.tp.valor * 0.35 : 1) * (a.tp.terco < -0.2 && t.hp / t.st.hp < 0.35 ? 1 + -a.tp.terco * 0.3 : 1), allT = (t.buffs.all > 0 ? 1 / ULT_ALL_MUL : 1) * (t.tp.valor > 0.2 && t.hp / t.st.hp < t.scaredHp ? 1 - t.tp.valor * 0.15 : 1); // potenciado / valiente
    const dmg = Math.max(1, pow * ot * allA * allT * (0.85 + Math.random() * 0.3) * (1 - t.st.defense / (t.st.defense + 40)) * (t.buffs.defense > 0 ? 0.5 : 1));
    a.hitsN++; t.hitsN++;
    if (kind === 'melee') a.dmgM += dmg; else a.dmgR += dmg;
    t.hp -= dmg; t.hurtT = 0.12; t.mouthOpen = 1; t.minHpF = Math.min(t.minHpF, Math.max(0, t.hp / t.st.hp));
    t.damageFrom.set(a.id, (t.damageFrom.get(a.id) || 0) + dmg);
    if (t.target !== a) t.targetTimer = Math.min(t.targetTimer, 0.1);
    const kb = (kind === 'melee' ? 40 : 30) * pow / t.st.weight; // el peso regula el knockback
    t.vx += dir.x * kb; t.vy += dir.y * kb; t.vz += Math.min(380, kb * 0.5);
    if (t.state !== 'dead' && t.state !== 'ultcharge') { t.state = 'hitstun'; t.stT = 0.12 + Math.min(0.4, kb / 1600); }
    if (kb > 300) t.setEmo('dizzy', 1.0, 4); else t.setEmo('hurt', 0.35, 3); // golpe fuerte = mareado
    for (const n of t.nodes) { n.vx += dir.x * kb * 0.9 * (0.5 + Math.random()); n.vy += dir.y * DEPTH * kb * 0.5 - kb * 0.3 * Math.random(); }
    const tm = t.nodes[t.ix.mid];
    const hx = tm.x - dir.x * t.r * 0.6, hy = tm.y - dir.y * t.r * 0.3;
    const col = kind === 'melee' ? '#fff3b0' : null;
    for (let i = 0; i < (kind === 'melee' ? 10 : 6); i++) {
      const a2 = Math.random() * TAU, sp = 60 + Math.random() * 200;
      this.parts.push({ x: hx, y: hy, vx: Math.cos(a2) * sp + dir.x * 80, vy: Math.sin(a2) * sp - 60, life: 0.35 + Math.random() * 0.25, col: col || hsl(a.g.pal.accent, 15), r: 2 + Math.random() * 2.5 });
    }
    this.texts.push({ x: t.gx + (Math.random() - 0.5) * 20, y: t.nodes[t.ix.head].y - t.g.head.h * t.s * 0.7, str: Math.round(dmg) + '', col: kind === 'melee' ? '#ffffff' : '#ffd88a', life: 0.8, big: dmg > 15 });
    this.shake = Math.min(12, this.shake + kb / 45);
    if (t.hp <= 0 && !t.dead) {
      t.hp = 0; t.die(dir, kb); a.kills++; this.text(t, 'K.O.', '#ff7a7a', true);
      if (!a.dead) a.setEmo('happy', 1.5, 3);
      if (!this.ms.some(m => m.team === t.team && !m.dead)) this.elim.push(t.team); // equipo eliminado
    }
  }

  // ---------- Ultimate ----------
  startUlt(m) {
    this.cine = { m, t: 0 }; m.state = 'free';
    m.desired = { x: 0, y: 0 }; m.vx = m.vy = 0; m.auraBoost = 1.6; m.setEmo('angry', 2.2, 5); m.mouthOpen = 1;
  }
  cineStep(dt) {
    const c = this.cine, m = c.m; c.t += dt;
    m.animate(dt); m.rigStep(dt / 2); m.rigStep(dt / 2);
    for (const o of this.ms) if (o !== m) o.auraStep(dt);
    this.shake = c.t > 0.45 && c.t < 1.35 ? 2.5 : 0;
    if (c.t > 0.5 && c.t < 1.3 && m.z === 0 && Math.random() < dt * 3) m.vz = 120;
    if (c.t > 0.6) m.hop(dt);
    if (c.t >= 1.75) { this.cine = null; m.z = 0; m.vz = 0; this.execUlt(m); }
  }
  execUlt(m) {
    m.ultReady = false; m.aura = [];
    this.text(m, ULTS[m.ultType].name, '#ffe08a', true);
    m.buffs.all = ULT_ALL_S; setTimeout(() => { if (battle === this && !m.dead) this.text(m, '¡Potenciado!', '#ffcf6e'); }, 450);
    const enemies = this.ms.filter(e => !e.dead && e.team !== m.team);
    const T = m.target && !m.target.dead ? m.target : enemies[0];
    switch (m.ultType) {
      case 'ranged': { // bala gigante que atraviesa todo hasta salir de la arena
        const dx = T ? T.x - m.x : 1, dy = T ? T.y - m.y : 0, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, head = m.nodes[m.ix.head];
        this.proj.push({ giant: true, x: m.x + ux * m.r, y: m.y + uy * m.r, z: Math.max(20, m.gy - head.y), vx: ux * 300, vy: uy * 300, owner: m, team: m.team,
          pow: m.st.ranged * 4, r: 30, color: hsl(m.g.pal.accent, 12), kind: 'blob', life: 99, checked: new Set(), hitSet: new Set(), trail: [] });
        m.vx -= ux * 260; m.vy -= uy * 260; m.state = 'recoil'; m.stT = 0.4; this.shake = 8;
        break;
      }
      case 'melee': { // onda de choque: golpea todo alrededor y lo lanza al otro lado
        this.rings.push({ x: m.x, y: m.y, r: 10, max: ULT_RADIUS, life: 0.55, col: hsl(m.g.pal.accent, 20) });
        m.vz = 260; this.shake = 14;
        for (const e of enemies) {
          let dx = e.x - m.x, dy = e.y - m.y, d = Math.hypot(dx, dy);
          if (d > ULT_RADIUS) continue;
          if (d < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy); }
          const dir = { x: dx / d, y: dy / d };
          this.hit(m, e, m.st.melee * 2.5, dir, 'melee');
          const V = ARENA_W * 3.3 / Math.pow(e.st.weight, 0.25);
          e.vx = dir.x * V; e.vy = dir.y * V; e.vz = 420;
          if (!e.dead) { e.state = 'hitstun'; e.stT = 0.9; e.setEmo('dizzy', 1.4, 4); }
        }
        break;
      }
      default: m.buffs[m.ultType] = ULT_BUFF_S; // escudo / supervelocidad / reflejos
    }
  }

  step(dt) {
    if (this.cine) { this.cineStep(dt); return; } // la pelea se pausa durante el acercamiento de cámara
    this.time += dt;
    for (const m of this.ms) m.think(dt, this);
    for (const m of this.ms) m.physics(dt);
    // separación entre cuerpos
    const al = this.ms.filter(m => !m.dead);
    for (let i = 0; i < al.length; i++) for (let j = i + 1; j < al.length; j++) {
      const a = al[i], b = al[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), mn = a.r + b.r;
      if (d < mn && d > 0.01) { const p = (mn - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * p; a.y -= ny * p; b.x += nx * p; b.y += ny * p; }
    }
    // proyectiles
    for (const p of this.proj) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.z += (28 - p.z) * dt * 1.5;
      p.trail.push([p.x, p.y, p.z]); if (p.trail.length > 7) p.trail.shift();
      const sp = Math.hypot(p.vx, p.vy), ux = p.vx / sp, uy = p.vy / sp;
      for (const m of this.ms) {
        if (m.dead || m.team === p.team) continue;
        const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy);
        if (p.giant) { if (d < m.r + p.r && !p.hitSet.has(m.id)) { p.hitSet.add(m.id); this.hit(p.owner, m, p.pow, { x: ux, y: uy }, 'proj'); this.shake = Math.min(14, this.shake + 6); } continue; } // atraviesa todo
        if (d < m.r + p.r) { this.hit(p.owner, m, p.pow, { x: ux, y: uy }, 'proj'); p.life = 0; break; }
        if (!p.checked.has(m.id) && d < 170) {
          const along = dx * ux + dy * uy, perp = Math.abs(dx * uy - dy * ux);
          if (along > 0 && perp < m.r + p.r + 12) { p.checked.add(m.id); m.incoming(p.owner, { x: ux, y: uy }, this); }
        }
      }
      if (p.x < -20 || p.x > ARENA_W + 20 || p.y < -20 || p.y > ARENA_D + 20) p.life = 0;
    }
    this.proj = this.proj.filter(p => p.life > 0);
    for (const r of this.rings) { r.life -= dt; r.r += (r.max * 1.3 - r.r) * dt * 9; }
    this.rings = this.rings.filter(r => r.life > 0);
    for (const q of this.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.life -= dt; }
    this.parts = this.parts.filter(q => q.life > 0);
    for (const t of this.texts) { t.y -= 45 * dt; t.life -= dt; }
    this.texts = this.texts.filter(t => t.life > 0);
    this.shake *= Math.exp(-dt * 10);
    if (this.banner) { this.banner.t += dt; if (this.banner.t > 2.4) this.banner = null; }
    // partes del cuerpo
    for (const m of this.ms) { this.place(m); m.animate(dt); m.rigStep(dt / 2); m.rigStep(dt / 2); }
    // fin
    if (!this.over) {
      if (this.time > OT_START && !this.otShown) { this.otShown = true; this.banner = { text: '¡Muerte súbita!', sub: 'el daño va subiendo', t: 0 }; this.shake = 6; }
      const alive = new Set(this.ms.filter(m => !m.dead).map(m => m.team));
      if (alive.size <= 1 || this.time > HARD_LIMIT) {
        this.over = true; this.timedOut = alive.size > 1;
        // posiciones: los que siguen vivos (por % de vida) y luego los eliminados, del último al primero
        const hpf = tm => this.ms.filter(m => m.team === tm).reduce((a, m) => a + m.hp / m.st.hp, 0);
        this.ranking = [...alive].sort((a, b) => hpf(b) - hpf(a)).concat([...this.elim].reverse());
        this.winTeam = this.ranking[0];
        for (const m of this.ms) if (!m.dead) { m.winEmo = m.team === this.winTeam ? 'happy' : 'sad'; m.emoT = 0; }
      }
    } else {
      this.endT += dt;
      for (const m of this.ms) if (m.winEmo === 'happy' && m.z === 0 && Math.random() < dt * 2.5) m.vz = 230;
    }
  }

  draw(ctx) {
    ctx.save();
    if (this.shake > 0.2) ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    if (this.cine) { // acercamiento de cámara al monstruo que usa la ultimate
      const e = cineE(this.cine.t), m = this.cine.m, cx = ARENA_W / 2, cy = (TOP + ARENA_D * DEPTH + 30) / 2;
      const fx = m.gx, fy = m.nodes[m.ix.mid].y - 20, z = 1 + 1.4 * e;
      ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-lerp(cx, fx, e), -lerp(cy, fy, e));
    }
    drawArena(ctx);
    // sombras
    for (const m of this.ms) {
      if (m.alpha <= 0) continue;
      const lift = m.z + m.hover * m.s, k = clamp(1 - lift / 120, 0.3, 1);
      if (m.buffs.all > 0 && !m.dead) { ctx.fillStyle = `rgba(255,207,110,${0.35 * Math.min(1, m.buffs.all) * (0.75 + 0.25 * Math.sin(m.t * 8))})`; ctx.beginPath(); ctx.ellipse(m.gx, m.gy, m.r * 1.9 * m.s, m.r * 0.7 * m.s, 0, 0, TAU); ctx.fill(); }
      ctx.fillStyle = `rgba(30,15,40,${0.28 * k * m.alpha})`; ctx.beginPath(); ctx.ellipse(m.gx, m.gy, m.r * 1.25 * m.s * k, m.r * 0.42 * m.s * k, 0, 0, TAU); ctx.fill();
    }
    for (const r of this.rings) { const gy = TOP + r.y * DEPTH; ctx.globalAlpha = clamp(r.life * 2, 0, 1); ctx.strokeStyle = r.col; ctx.lineWidth = 10; ctx.beginPath(); ctx.ellipse(r.x, gy, r.r, r.r * DEPTH, 0, 0, TAU); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1; }
    for (const p of this.proj) { const gy = TOP + p.y * DEPTH; ctx.fillStyle = 'rgba(30,15,40,.2)'; ctx.beginPath(); ctx.ellipse(p.x, gy, p.r, p.r * 0.4, 0, 0, TAU); ctx.fill(); }
    // monstruos ordenados por profundidad
    const sorted = [...this.ms].sort((a, b) => (a.dead - b.dead) || a.y - b.y);
    for (const m of sorted) m.draw(ctx);
    // proyectiles
    for (const p of this.proj) {
      const Y = (pt) => TOP + pt[1] * DEPTH - pt[2];
      ctx.lineCap = 'round';
      for (let i = 1; i < p.trail.length; i++) { const a = p.trail[i - 1], b = p.trail[i]; ctx.strokeStyle = p.color; ctx.globalAlpha = i / p.trail.length * 0.5; ctx.lineWidth = p.r * (p.kind === 'laser' ? 1.4 : 1.2) * i / p.trail.length; ctx.beginPath(); ctx.moveTo(a[0], Y(a)); ctx.lineTo(b[0], Y(b)); ctx.stroke(); }
      ctx.globalAlpha = 1;
      const y = TOP + p.y * DEPTH - p.z;
      ctx.fillStyle = p.color; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(p.x, y, p.r * 1.8, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(p.x - p.r * 0.3, y - p.r * 0.3, p.r * 0.4, 0, TAU); ctx.fill();
    }
    for (const q of this.parts) { ctx.globalAlpha = clamp(q.life * 3, 0, 1); ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
    // ★ sobre tus monstruos (la vida se ve en los datos de arriba)
    for (const m of this.ms) {
      if (m.dead || !m.isPlayer) continue;
      const h = m.nodes[m.ix.head]; let top = h.y - m.g.head.h * m.s * 0.55;
      for (const hr of m.ix.horns) top = Math.min(top, m.nodes[hr.tip].y);
      ctx.fillStyle = '#ffcf6e'; ctx.font = '900 16px system-ui'; ctx.textAlign = 'center'; ctx.fillText('★', m.gx, top - 8);
    }
    ctx.textAlign = 'center';
    for (const t of this.texts) {
      ctx.globalAlpha = clamp(t.life * 2.5, 0, 1); ctx.font = `900 ${t.big ? 24 : 17}px system-ui`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,30,.85)'; ctx.strokeText(t.str, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function teamColor(m, mode) {
  if (m.isPlayer) return '#ffcf6e';
  if (mode === '2v2') return m.team === 0 ? '#5ee08a' : '#ff5d6c';
  return '#ff5d6c';
}

function drawArena(ctx) {
  const g0 = TOP, g1 = TOP + ARENA_D * DEPTH;
  // muro del fondo: ocupa todo el espacio sobre el suelo (ahí se ven los cuerpos de los que están atrás)
  const wh = Math.ceil(TOP / 20) * 20, wy = g0 - wh;
  const wg = ctx.createLinearGradient(0, wy, 0, g0); wg.addColorStop(0, '#2a2046'); wg.addColorStop(1, '#4d3c76');
  ctx.fillStyle = wg; ctx.fillRect(-40, wy, ARENA_W + 80, wh);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
  for (let r = 0; r < wh / 20; r++) { const y = wy + r * 20; ctx.beginPath(); ctx.moveTo(-40, y); ctx.lineTo(ARENA_W + 40, y); ctx.stroke(); for (let x = -40 + (r % 2) * 25; x < ARENA_W + 40; x += 50) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 20); ctx.stroke(); } }
  const gg = ctx.createLinearGradient(0, g0, 0, g1); gg.addColorStop(0, '#b8925e'); gg.addColorStop(1, '#e0bd80');
  ctx.fillStyle = gg; ctx.fillRect(-40, g0, ARENA_W + 80, g1 - g0);
  ctx.strokeStyle = 'rgba(90,50,20,.12)'; ctx.lineWidth = 1.5;
  for (let y = 0; y <= ARENA_D; y += 56) { ctx.beginPath(); ctx.moveTo(-40, g0 + y * DEPTH); ctx.lineTo(ARENA_W + 40, g0 + y * DEPTH); ctx.stroke(); }
  for (let x = 0; x <= ARENA_W; x += 60) { ctx.beginPath(); ctx.moveTo(x, g0); ctx.lineTo(x, g1); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(ARENA_W / 2, g0 + ARENA_D * DEPTH / 2, 90, 90 * DEPTH, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#7a5a38'; ctx.fillRect(-40, g1, ARENA_W + 80, 16);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-40, g0, ARENA_W + 80, 6);
}

// ============================================================================
// GUARDADO
// ============================================================================
const STAGE_NAME = { egg: 'Huevo', baby: 'Bebé', child: 'Niño', teen: 'Adolescente', adult: 'Adulto', awakened: 'Awakened' };
const STAGE_ORDER = ['egg', 'baby', 'child', 'teen', 'adult', 'awakened'];
const MAX_LIVES = 3;
const REST_MS = 10 * 60 * 1000;   // descanso al quedarse sin vidas
const HEART_MS = 5 * 60 * 1000;   // recupera 1 corazón cada 5 min (si le queda al menos uno)
const HEAL_COST = 30;             // monedas para curar al instante
// [XP, monedas] por posición, según cuántos equipos pelean. Cada K.O. suma +10 XP y +5 monedas.
const REWARDS = { 2: [[60, 25], [20, 5]], 3: [[70, 30], [40, 15], [20, 5]], 4: [[80, 40], [50, 20], [30, 10], [15, 5]] };
const PLACE_NAME = ['1.er lugar', '2.º lugar', '3.er lugar', '4.º lugar'];
const hearts = n => `<span class="hearts">${'♥'.repeat(n)}${'♡'.repeat(MAX_LIVES - n)}</span>`;
const resting = rec => rec.restUntil && Date.now() < rec.restUntil;
const canFight = rec => rec.stage !== 'egg' && !resting(rec);
// Si terminó el descanso, vuelve con todas sus vidas
function wakeUp() {
  let ch = false; const now = Date.now();
  for (const m of save.monsters) {
    if (m.restUntil && now >= m.restUntil) { delete m.restUntil; m.lives = MAX_LIVES; ch = true; }
    if (!m.restUntil && m.lives > 0 && m.lives < MAX_LIVES) { // corazones con el tiempo
      if (!m.heartAt) { m.heartAt = now + HEART_MS; ch = true; }

  if (!show) return;

function makeFoe(ref) {

  }
  lastMode = mode; lastTeam = mode === '2v2' ? team : null;
  const me = team[0];
  const zoom = Math.max(...team.map(r => ({ baby: 0.6, child: 0.7, teen: 0.82, adult: 1, awakened: 1 }[r.stage] || 1)));
  ARENA_W = 600 * zoom;

}

// ---------- Crecimiento: ocurre al volver al menú, con animación a pantalla completa ----------

  if (!(o.shoulders.size > 0) && n.shoulders.size > 0) out.push('shoulders');
  for (let i = o.tail.count; i < n.tail.count; i++) out.push('tail:' + i);
  for (let p = o.wings.pairs; p < n.wings.pairs; p++) out.push('wing:' + p);

    case 'leg': return I.legs.filter(L => L.p === p).flatMap(L => [L.knee, L.foot]);
    case 'arm': return I.arms.filter(a => a.p === p).flatMap(a => [a.el, a.ha]);
    case 'wing': return I.wings.filter(w => w.p === p).map(w => w.tip);

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(G.t * 0.35);
  const ri = G.phase === 'old' && G.step === 0 ? clamp(G.t / 1.6, 0, 1) : 1;
  for (let i = 0; i < 14; i++) { const a = i * TAU / 14; ctx.fillStyle = `rgba(255,240,200,${0.07 * ri})`; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - 0.09) * 1500, Math.sin(a - 0.09) * 1500); ctx.lineTo(Math.cos(a + 0.09) * 1500, Math.sin(a + 0.09) * 1500); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.translate(cx, gy); ctx.scale(k, k);
  const sc = G.phase === 'old' ? 1 : G.scl;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(M.gx, 0, M.r * 1.5 * sc, M.r * 0.42 * sc, 0, 0, TAU); ctx.fill();
  ctx.scale(sc, sc); M.draw(ctx); drawFxParts(ctx);
  ctx.restore();
  if (fx.flash > 0) { ctx.fillStyle = `rgba(255,250,235,${fx.flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
}
$('growOk').onclick = () => {
  growAnim = null; scene = 'home';
  $('growUI').classList.remove('on'); $('home').classList.add('on');
  renderHome();
  if (!checkGrowth()) { show.vz = 240; show.setEmo('happy', 2, 3); } // ¿hay otro que también crece?
};
$('quit').onclick = async () => { if (battle && !battle.over && !await ask('¿Abandonar la pelea? No ganas XP.', { ok: 'Abandonar', cancel: 'Seguir' })) return; goHome(); };
$('resHome').onclick = goHome;
$('resAgain').onclick = () => startBattle(lastMode);

function finishBattle() {
  const rank = battle.ranking, nTeams = rank.length, place = rank.indexOf(0) + 1;
  const [bx, bc] = (REWARDS[nTeams] || REWARDS[2])[place - 1];
  const lines = battle.players.map(pm => {
    const rec = pm.rec, xp = bx + pm.kills * 10, coins = bc + pm.kills * 5;
    rec.xp += xp; save.coins += coins;
    place === 1 ? rec.wins++ : rec.losses++;
    // vidas: sólo se pierde una si lo noquearon
    let lifeTxt = '';
    if (pm.dead) {
      rec.lives = Math.max(0, rec.lives - 1);
      if (rec.lives === 0) { rec.restUntil = Date.now() + REST_MS; lifeTxt = `<br>Lo noquearon y se quedó sin vidas ${hearts(0)}<br>Descansará ${REST_MS / 60000} min antes de volver a pelear.`; }
      else lifeTxt = `<br>Lo noquearon: pierde una vida ${hearts(rec.lives)}`;
    }
    let ups = 0; while (rec.xp >= xpNeed(rec.level)) { rec.xp -= xpNeed(rec.level); rec.level++; ups++; }
    // sus peleas moldean su personalidad
    const ch = [], tw = (k, d, lbl) => { adjustTemper(rec, k, d); ch.push(lbl); };
    if (pm.dmgM + pm.dmgR > 0) { if (pm.dmgR > pm.dmgM * 1.2) tw('agr', -0.03, 'más Cauto'); else if (pm.dmgM > pm.dmgR * 1.2) tw('agr', 0.03, 'más Agresivo'); }
    if (!pm.dead && pm.minHpF < 0.25) tw('valor', 0.04, 'más Valiente'); else if (pm.dead) tw('valor', -0.03, 'más Prudente');
    if (pm.switches >= 2) tw('terco', -0.03, 'más Oportunista'); else if (pm.switches === 0 && place === 1) tw('terco', 0.02, 'más Terco');
    lifeTxt += (ups ? `<br>¡Subió a <b>nivel ${rec.level}</b>! +${ups * PTS_PER_LEVEL} puntos de entrenamiento` : '') + (ch.length ? `<br><small>Personalidad: ${ch.join(', ')}</small>` : '');
    ups = 0;
    return `${esc(rec.name)} gana <b>+${xp} XP</b> y <b>+${coins} monedas</b>${pm.kills ? ` (${pm.kills} K.O.)` : ''}.` + lifeTxt + (ups ? `<br>¡Subió a <b>nivel ${rec.level}</b>!` : '');
  });
  wakeUp();
  persist(); // si ya puede crecer, crece recién al volver al menú (ver checkGrowth)
  $('resTitle').textContent = battle.timedOut ? '¡Se acabó el tiempo!' : nTeams === 2 ? (place === 1 ? '¡Victoria!' : 'Derrota') : (place === 1 ? '¡1.er lugar!' : PLACE_NAME[place - 1]);
  $('resTitle').className = place === 1 ? 'win' : place === nTeams ? 'lose' : 'mid';
  $('resText').innerHTML = lines.join('<br><br>');
  $('resAgain').disabled = battle.mode === '2v2' ? !(save.monsters.filter(canFight).length >= 2 || canFight(cur())) : !canFight(cur());
  $('result').classList.add('on');
}

// ============================================================================
// LOOP
// ============================================================================
let last = performance.now(), acc = 0, frame = 0;
const STEP = 1 / 60;
function loop(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1b1530'; ctx.fillRect(0, 0, W, H);

  if (scene === 'home' && (show || egg)) {
    acc += dt; let n = 0;
    while (acc >= STEP && n++ < 5) {
      acc -= STEP; fxStep(STEP);
      if (egg) egg.update(STEP);
      else show.homeStep(STEP, homeBounds.halfW, homeBounds.maxZ);
    }
    // Escala fija de referencia: así los bebés se ven chicos y los adultos grandes
    const ra = $('showArea').getBoundingClientRect(), rb = $('trainArea').getBoundingClientRect();
    const r = Math.abs(ra.left + ra.width / 2 - W / 2) < Math.abs(rb.left + rb.width / 2 - W / 2) ? ra : rb;
    const sz = egg ? { w: egg.w, h: egg.h } : show.estSize();
    const k = Math.min(r.height * 0.78 / Math.max(sz.h, 150), r.width * 0.8 / Math.max(sz.w, 140), 3.2);
    homeView = { cx: r.left + r.width / 2, gy: r.bottom - r.height * 0.06, k };
    homeBounds = { halfW: Math.max(10, r.width / 2 / k - sz.w * 0.3), maxZ: Math.max(20, r.height * 0.92 / k - sz.h * 1.05) };
    const pal = egg ? egg.pal : show.g.pal, rad = Math.max(sz.h, 60) * k * 0.5;
    const glow = ctx.createRadialGradient(homeView.cx, homeView.gy - rad, 10, homeView.cx, homeView.gy - rad, Math.max(r.width, r.height) * 0.7);
    glow.addColorStop(0, hsl(pal.body, -20, 0.35)); glow.addColorStop(1, 'rgba(27,21,48,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(homeView.cx, homeView.gy); ctx.scale(k, k);
    if (egg) {
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 0, egg.w * 0.55, egg.w * 0.16, 0, 0, TAU); ctx.fill();
      egg.draw(ctx);
    } else {
      const lift = show.z + show.hover, kk = clamp(1 - lift / 120, 0.3, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.3 * kk})`; ctx.beginPath(); ctx.ellipse(show.gx, 0, show.r * 1.4 * kk, show.r * 0.4 * kk, 0, 0, TAU); ctx.fill();
      show.draw(ctx);
      if (show.sleep) { // Zzz mientras descansa
        const h = show.nodes[show.ix.head];
        ctx.fillStyle = 'rgba(220,210,255,.85)'; ctx.textAlign = 'center';
        for (let i = 0; i < 3; i++) { const ph = (performance.now() / 1400 + i / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI); ctx.font = `800 ${10 + ph * 10}px system-ui`; ctx.fillText('z', h.x + show.g.head.w * 0.5 + ph * 22, h.y - show.g.head.h * 0.4 - ph * 34); }
        ctx.globalAlpha = 1;
      }
    }
    drawFxParts(ctx);
    ctx.restore();
    if (fx.flash > 0) { ctx.fillStyle = `rgba(255,250,235,${fx.flash * 0.55})`; ctx.fillRect(0, 0, W, H); }
    if (fx.labelT > 0 && fx.label) {
      const a = clamp(fx.labelT, 0, 1), y = homeView.gy - Math.max(sz.h, 60) * k - 30 - (2.4 - fx.labelT) * 12;
      ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.font = '900 24px system-ui';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,10,30,.9)'; ctx.strokeText(fx.label, homeView.cx, y);
      ctx.fillStyle = '#ffcf6e'; ctx.fillText(fx.label, homeView.cx, y); ctx.globalAlpha = 1;
    }
  } else if (scene === 'grow' && growAnim) {
    acc += dt; let n = 0;
    while (acc >= STEP && n++ < 5) { acc -= STEP; growStep(STEP); }
    drawGrow();
  } else if (scene === 'battle' && battle) {
    acc += dt * BATTLE_SPEED; let n = 0;
    while (acc >= STEP && n++ < 12) { acc -= STEP; battle.step(STEP); }
    const top = $('fighters').getBoundingClientRect().bottom + 8, bottom = 16;
    const bw = ARENA_W + 60, bh = TOP + ARENA_D * DEPTH + 30;
    const k = Math.min(W / bw, (H - top - bottom) / bh);
    ctx.save(); ctx.translate((W - ARENA_W * k) / 2, top + Math.max(0, ((H - top - bottom) - bh * k) / 2)); ctx.scale(k, k);
    battle.draw(ctx);
    ctx.restore();
    if (battle.cine) drawCineOverlay(battle.cine);
    if (battle.banner) drawBanner(battle.banner);
    if (++frame % 6 === 0) updateFighters();
    if (battle.over && battle.endT > 1.8 && !battle.reported) { battle.reported = true; updateFighters(); finishBattle(); }
  }
  if (scene === 'home' && show && frame % 20 === 0) show.baseEmo = baseEmoFor(cur()); // se le pasa la felicidad
  if (scene === 'home' && ++frame % 20 === 0 && (cur().restUntil || cur().heartAt || (cur().lives < MAX_LIVES && cur().stage !== 'egg'))) { if (wakeUp()) renderHome(); else { updateRest(); updateSub(); } }
  requestAnimationFrame(loop);
}
renderHome();
checkGrowth();
if (save.notice) { const n = save.notice; delete save.notice; persist(); ask(n, { ok: 'Entendido', cancel: null }); }
requestAnimationFrame(loop);
</script>
