<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Brawl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Monster Brawl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#1b1530;--panel:#251d3d;--panel2:#33295a;--text:#f3eefe;--muted:#a99fc7;--acc:#ffb84d;--good:#5ee08a;--bad:#ff5d6c}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.px{image-rendering:crisp-edges;image-rendering:pixelated} /* estilo Pixel: se dibuja en baja resolución y se agranda sin suavizar */
.stylepick{display:flex;gap:8px}.stylepick .btn{flex:1}.stylepick .btn.on{background:linear-gradient(#ffcf6e,#ff9a3c);color:#2a1600}
.screen{position:fixed;inset:0;display:none;flex-direction:column;pointer-events:none;padding-block:calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-bottom, 0px) + 10px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.screen.on{display:flex}
.screen>*{pointer-events:auto}
.spacer{flex:1;pointer-events:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--panel2);padding:12px 10px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:linear-gradient(#ffcf6e,#ff9a3c);color:#2a1600}
.btn.ghost{background:transparent;box-shadow:none;padding:8px 12px}
.row{display:flex;gap:8px}
.row>.btn{flex:1}
.title{text-align:center;font-weight:900;letter-spacing:1px;font-size:22px;margin:2px 0 4px}
.title small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nav .name{flex:1;text-align:center}
.nav .name b{font-size:20px;display:block}
.nav .name span{font-size:12px;color:var(--muted)}
.nav .name span:empty{display:none}
#showArea{position:relative}
#home.ranch #lblBot{display:none}
.pgShop{order:0}#pgHome{order:1}.pgStats{order:2} /* rancho: Tienda arriba; de cerca: arriba se vuelve al rancho y abajo están las Estadísticas */
#home.ranch #pgHome>:not(#showArea):not(.edgeLbl),#home.ranch .corner{display:none} /* rancho: sólo el paisaje con todos los monstruos */
.ranchHint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;white-space:nowrap;color:var(--muted);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#home:not(.ranch) .ranchHint{display:none}
.edgeLbl{flex:none;align-self:center;background:none;padding:3px 14px;font-size:13px;font-weight:800;letter-spacing:.5px;color:#cfc4ff;text-shadow:0 1px 3px rgba(0,0,0,.7);touch-action:none} /* en lugar de pestañas: arriba/abajo dice qué página hay (y se puede tocar) */
.edgeLbl.up{margin-bottom:2px;animation:edgeUp 2.4s ease-in-out infinite}.edgeLbl.down{margin-top:4px;animation:edgeDown 2.4s ease-in-out infinite}
.edgeLbl.glow{color:#ffd36b;animation:tabglow 1.6s ease-in-out infinite,edgeDown 2.4s ease-in-out infinite} /* puntos por gastar */
@keyframes edgeUp{0%,100%{transform:none}50%{transform:translateY(-3px)}}@keyframes edgeDown{0%,100%{transform:none}50%{transform:translateY(3px)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.zoomIn{animation:zoomIn .45s ease-out}
@keyframes cardUp{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes cardDown{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.cardUp{animation:cardUp .42s cubic-bezier(.2,.8,.2,1)}.cardDown{animation:cardDown .42s cubic-bezier(.2,.8,.2,1)}
.corner{position:absolute;font-weight:800;font-size:16px;color:var(--text);text-shadow:0 2px 3px rgba(0,0,0,.5);line-height:1.15}
.corner.tl{top:4px;left:2px}.corner.tr{top:4px;right:2px;text-align:right}.corner.bl,.corner.br{bottom:4px;left:2px;color:var(--muted);font-size:14px}.corner.br{left:auto;right:2px;text-align:right}
.corner .hearts{font-size:20px}.corner.br{color:#cfc4ff;font-size:22px;font-weight:900}
.corner small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.hint{text-align:center;font-size:11px;color:var(--muted);pointer-events:none!important;margin-bottom:6px}
.panel{background:rgba(37,29,61,.94);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(6px)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.stats:empty{display:none}
.stat{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px;font-size:12px}
.stat .lb{color:var(--muted)}
.stat .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.parts{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.tabs{display:flex;justify-content:center;gap:2px;margin:4px 0 6px}
.tabs button{background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;padding:7px 8px;white-space:nowrap;border-radius:999px;letter-spacing:.3px}
.tabs button.on{background:var(--panel2);color:var(--text)}
.tabs button.locked{opacity:.5}
#home.first>:not(.pager),#home.first .page>:not(#showArea),#home.first .corner{visibility:hidden} /* partida nueva: en pantalla sólo el huevo */
#home.vacant .panel>.row,#home.vacant #btnFight{display:none}
.fightbtn{font-size:19px;padding:15px 10px;letter-spacing:.5px}
#homePanel:not(.fightOpen) .fightrow{display:none} /* "Luchar" abre las opciones de pelea */
#homePanel.fightOpen #btnFight{display:none}
#homePanel.fightOpen .fightrow{animation:zoomIn .3s ease-out}
.fightrow .fightclose{flex:none;width:52px} /* espacio libre: sólo Comprar y Criar */ /* partida nueva: sólo el huevo, sin botones */
@media (max-width:380px){.tabs{gap:0}.tabs button{font-size:11.5px;padding:7px 6px;letter-spacing:0}} /* celulares angostos: que quepan las 4 pestañas */
.ultbar{display:flex;gap:8px;justify-content:center;padding-top:6px}
.ultbtn{flex:1;max-width:260px;padding:10px 8px;border-radius:16px;background:linear-gradient(#ffe08a,#ff9a3c 60%,#e8641c);color:#2a1200;box-shadow:0 4px 0 #8a3a0a,0 0 18px rgba(255,170,60,.55);display:flex;flex-direction:column;align-items:center;gap:1px;animation:ultpulse 1.4s ease-in-out infinite}
.ultbtn b{font-size:18px;font-weight:900;letter-spacing:2px}
.ultbtn small{font-size:11px;font-weight:700;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ultbtn:disabled{animation:none;background:var(--panel2);color:var(--muted);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.ultbtn.cd{background:linear-gradient(90deg,rgba(255,180,70,.45) var(--p,0%),var(--panel2) var(--p,0%));color:#ffe3a8} /* recargando: barra que se llena */
.ultbtn.cd b{font-size:22px}
.ultbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #8a3a0a}
@keyframes ultpulse{0%,100%{box-shadow:0 4px 0 #8a3a0a,0 0 10px rgba(255,170,60,.35)}50%{box-shadow:0 4px 0 #8a3a0a,0 0 24px rgba(255,190,80,.85)}}
@media (prefers-reduced-motion:reduce){.ultbtn{animation:none}}
.tabs button.glow{color:#ffd36b;animation:tabglow 1.6s ease-in-out infinite} /* Entrenar con puntos por gastar */
@keyframes tabglow{0%,100%{text-shadow:0 0 4px rgba(255,190,60,.45)}50%{text-shadow:0 0 12px rgba(255,200,70,.95),0 0 22px rgba(255,170,40,.55)}}
@media (prefers-reduced-motion:reduce){.tabs button.glow{animation:none;text-shadow:0 0 8px rgba(255,190,60,.7)}}
.pager{flex:1;position:relative;overflow:hidden;min-height:0;pointer-events:none!important}
.track{position:absolute;left:0;right:0;top:0;height:300%;display:flex;flex-direction:column;transition:transform .36s cubic-bezier(.2,.8,.2,1);pointer-events:none} /* páginas una debajo de otra: Tienda / Rancho / Estadísticas */
.page{height:33.3333%;width:100%;display:flex;flex-direction:column;min-height:0;pointer-events:none}
.page>*{pointer-events:auto}
.page>.spacer{pointer-events:none}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}
.trow .tl{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;min-width:0}
.trow .tl small{color:var(--muted);font-weight:600;font-size:11px}
.trow .tv{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.trow .tv b{color:var(--text)}
.trow .tv em{font-style:normal;color:var(--good)}
.pips{display:flex;gap:3px;grid-column:1}
.pips i{width:100%;max-width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.pips i.on{background:var(--acc)}
.trow .bar{grid-column:1}
.trow .tl small{margin-left:auto}
.tbtn{grid-row:1/4;grid-column:2;display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:14px}
.ci{flex:none;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff1b8,#ffc93c 55%,#d99a1c);box-shadow:inset 0 0 0 1.5px #b9801a}
#trainArea{flex:1 1 90px;min-height:90px}
.tpanel.shop{flex:1 1 auto;margin-top:6px}
.bdlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bdgo{display:flex;align-items:center;justify-content:center;gap:6px}
.adoptTxt{margin:0;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
.tpanel{min-height:0;overflow-y:auto;flex:0 1 auto;touch-action:pan-y}
#home .top,#home .tabs,#home .nav,#home .panel:not(.tpanel){touch-action:none} /* deslizar para cambiar de página sin que el navegador se lo robe */
.tinfo{text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.xp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.xp .bar{flex:1}
.xp .bar i{background:#8f7bff}
.topbar{display:flex;align-items:center;justify-content:space-between}
.topbar .mode{font-weight:800;font-size:15px}
.roundbtn{width:44px;height:44px;border-radius:50%;background:var(--panel2);font-weight:800}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.fighter{background:rgba(37,29,61,.9);border-radius:12px;padding:7px 9px;font-size:12px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}
.fighter.me{border-color:var(--acc)}
.fighter.dead{opacity:.4}
.fighter .nm{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fighter .chip{width:10px;height:10px;border-radius:50%;flex:none}
.fighter .bar{height:6px}
.modal{position:fixed;inset:0;background:rgba(10,6,20,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.on{display:flex}
.card{background:var(--panel);border-radius:20px;padding:20px;width:min(360px,100%);text-align:center;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:28px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
#dialog{z-index:6}
#dialog.low{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);background:rgba(10,6,20,.35)}
.card input{font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--panel2);background:var(--bg);color:var(--text);text-align:center;width:100%}
.card input:focus{outline:none;border-color:var(--acc)}
.btn:focus-visible,.roundbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn:disabled{opacity:.35;pointer-events:none}
.slotbtns{grid-column:1/-1}
.eggmsg{grid-column:1/-1;margin:4px 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .title{text-align:left;margin:0}
.lancard{max-width:380px;text-align:center}
.lanlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:4px 0 12px;max-height:46vh;overflow-y:auto;touch-action:pan-y}
.lanlist:empty{display:none}
.lanp{background:var(--panel2);border-radius:14px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;border:3px solid var(--tc);font-size:11px;color:var(--muted);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.lanp canvas{width:64px;height:64px}
.lanp b{color:var(--text);font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lanp .tc{font-weight:900;color:var(--tc)}
.lanp.me{cursor:pointer;background:#3d3166}
.lanp.me:active{transform:scale(.96)}
#lanQR{display:block;margin:6px auto 12px;border-radius:10px;image-rendering:pixelated}
#lanVideo{display:block;width:100%;max-height:46vh;object-fit:cover;border-radius:14px;margin:6px 0 12px;background:#000}
#lanBtns{flex-wrap:wrap}
#lanBtns .btn{flex:1 1 auto}
.instbtn{flex:none;margin-left:auto;margin-right:6px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:linear-gradient(#ffe08a,#ff9a3c);color:#2a1600}
.coins{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:5px 10px 5px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.coins i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff1b8,#ffc93c 55%,#d99a1c);box-shadow:inset 0 0 0 2px #b9801a}
.hearts,.nav .name .hearts{color:var(--bad);letter-spacing:1px}
.rest{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,93,108,.13);border-radius:12px;padding:8px 8px 8px 12px;font-size:13px;line-height:1.35}
.rest .btn{flex:none;padding:9px 12px;font-size:13px}
.rest.only{justify-content:center;background:none;padding:0}
.mid{color:var(--acc)}
.growTitle{font-weight:900;font-size:26px;text-align:center;margin-top:28px;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#growOk{align-self:center;min-width:220px;margin-bottom:16px;font-size:17px;padding:14px}
.tplist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:52vh;overflow-y:auto;touch-action:pan-y}
.tpc{background:var(--panel2);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid transparent;font-size:12px;color:var(--muted)}
.tpc b{color:var(--text);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpc canvas{width:72px;height:72px}
.tpc.on{border-color:var(--acc);background:#3d3166}
.tpc:disabled{opacity:.4}
.ultpill{margin-left:auto;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;background:linear-gradient(#ffe08a,#ff9a3c);color:#2a1600;letter-spacing:.5px}
.ultinfo{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.ultinfo b{color:var(--acc)}
.tsec{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.tsec:last-child{border-bottom:0;padding-bottom:0}
.thead{font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:800}
.pill.on{background:linear-gradient(#ffcf6e,#ff9a3c);color:#2a1600}
.tdesc{font-size:11px;color:var(--muted);margin:0;line-height:1.4}
.trow .tdesc{grid-column:1}
.axis{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.axis span:last-child{text-align:right}
.axis b{color:var(--text)}
.axtrack{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(90,169,255,.35),rgba(255,255,255,.12),rgba(255,122,90,.35))}
.axtrack i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--acc);transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--panel)}
.drills{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dbtn{font-size:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dbtn small{font-weight:600;color:var(--muted);font-size:10px}
.ultlist{display:flex;flex-direction:column;gap:6px}
.ultc{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.ultc.on{border-color:var(--acc)}
.ultc.locked b{color:var(--muted)}
.ultc b{font-size:13px}
.ultc .tdesc{grid-column:1}
.ultc .btn,.ultc .pill{grid-row:1/3;grid-column:2;font-size:12px;padding:8px 10px;display:flex;align-items:center;gap:5px}
.respec{align-self:center;font-size:12px;padding:8px 12px}
.persona{grid-column:1/-1;margin:2px 0 0;font-size:12px;color:var(--muted);text-align:center}
.persona b{color:var(--text)}
.win{color:var(--good)}.lose{color:var(--bad)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- HOME -->
<div id="home" class="screen on">
  <div class="top"><div class="title">MONSTER BRAWL<small>cría · pelea · evoluciona</small></div><button class="instbtn" id="btnInstall" hidden>Instalar</button><div class="coins" title="Monedas"><i></i><span id="coins">0</span></div></div>
  <div class="pager"><div class="track" id="track" style="transform:translateY(-33.3333%)">
  <div class="page pgShop">
    <div class="nav"><div class="name"><b>Tienda</b><span id="aSub"></span></div></div>
    <div class="panel tpanel shop">
      <div class="tsec" id="shopUlts"></div>
      <div class="tsec" id="shopStyle"></div>
    </div>
    <button class="edgeLbl down" data-go="1">Rancho ▼</button>
  </div>
  <div class="page" id="pgHome">
  <button class="edgeLbl up" data-go="0" id="lblTop">▲ Tienda</button>
  <div class="nav">
    <div class="name" id="nameBox"><b id="mName">—</b><span id="mSub">Nv. 1</span></div>
  </div>
  <div class="spacer" id="showArea"><div class="corner tl" id="cLv"></div><div class="corner tr" id="cHearts"></div><div class="corner bl" id="cIdx"></div><div class="corner br" id="cTime"></div></div>
  <div class="hint" id="hint" hidden></div>
  <div class="panel" id="homePanel">
    <div class="stats" id="stats"></div>
    <div class="rest" id="rest" hidden><span id="restTxt"></span><button class="btn" id="btnHeal">Curar ya</button></div>
    <button class="btn primary fightbtn" id="btnFight">⚔️ Luchar</button>
    <div class="row fightrow">
      <button class="btn" id="btnLan">📶 Pelea local</button>
      <button class="btn fightclose" id="btnFightClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="row fightrow">
      <button class="btn primary" data-mode="1v1">1 vs 1</button>
      <button class="btn primary" data-mode="2v2">2 vs 2</button>
      <button class="btn primary" data-mode="ffa">Todos vs todos</button>
    </div>
  </div>
  <button class="edgeLbl down" id="lblBot">Estadísticas ▼</button>
  </div>
  <div class="page pgStats">
    <button class="edgeLbl up" data-go="1">▲ Monstruo</button>
    <div class="nav"><div class="name"><b id="tName">—</b><span id="tSub"></span></div></div>
    <div class="spacer" id="trainArea"></div>
    <div class="panel tpanel">
      <div class="tlist" id="tlist"></div>
      <div class="tinfo" id="tinfo"></div>
      <button class="btn" id="btnFree">Liberar</button>
    </div>
  </div>
  </div></div>
</div>

<!-- BATTLE -->
<div id="battleUI" class="screen">
  <div class="topbar">
    <button class="roundbtn" id="quit">✕</button>
    <div class="mode" id="modeLbl">1 vs 1</div>
    <span class="roundbtn" style="visibility:hidden" aria-hidden="true"></span>
  </div>
  <div class="fighters" id="fighters"></div>
  <div class="spacer"></div>
  <div class="ultbar" id="ultBar" hidden></div>
</div>

<!-- CRECIMIENTO -->
<div id="growUI" class="screen">
  <div class="growTitle" id="growTitle"></div>
  <div class="spacer"></div>
  <button class="btn primary" id="growOk" hidden>Continuar</button>
</div>

<div class="modal" id="lan">
  <div class="card lancard">
    <h2 style="font-size:22px">Pelea local</h2>
    <p id="lanInfo"></p>
    <div class="lanlist" id="lanList"></div>
    <canvas id="lanQR" hidden></canvas>
    <video id="lanVideo" playsinline muted hidden></video>
    <div class="row" id="lanBtns"></div>
  </div>
</div>
<div class="modal" id="breedPick">
  <div class="card">
    <h2 style="font-size:22px">Elige a los padres</h2>
    <p id="bpInfo"></p>
    <div class="tplist" id="bpList"></div>
    <div class="row">
      <button class="btn" id="bpNo">Cancelar</button>
      <button class="btn primary" id="bpGo">Criar</button>
    </div>
  </div>
</div>
<div class="modal" id="teamPick">
  <div class="card">
    <h2 style="font-size:22px">Elige tu equipo</h2>
    <p id="tpInfo"></p>
    <div class="tplist" id="tpList"></div>
    <div class="row">
      <button class="btn" id="tpNo">Cancelar</button>
      <button class="btn primary" id="tpGo">Pelear</button>
    </div>
  </div>
</div>

<div class="modal" id="result">
  <div class="card">
    <h2 id="resTitle">¡Victoria!</h2>
    <p id="resText"></p>
    <div class="row">
      <button class="btn" id="resHome">Volver</button>
      <button class="btn" id="resRoom" hidden>🎨 Equipos</button>
      <button class="btn primary" id="resAgain">Otra pelea</button>
    </div>
  </div>
</div>

<div class="modal" id="dialog">
  <div class="card">
    <p id="dlgText"></p>
    <input id="dlgInput" maxlength="16" autocomplete="off">
    <div class="row">
      <button class="btn" id="dlgNo">Cancelar</button>
      <button class="btn primary" id="dlgYes">Aceptar</button>
    </div>
  </div>
</div>

function eyeLayout(n, y, sp) {

function scaleGenome(g, k) {
  if (k === 1) return;
  const m = (o, keys) => keys.forEach(key => o[key] *= k);
  m(g.head, ['w', 'h']); m(g.eyes, ['size']); m(g.horns, ['len', 'width']); m(g.neck, ['len', 'w']);
  for (const sg of [g.torso.upper, g.torso.mid, g.torso.lower]) if (sg) m(sg, ['w', 'h']);
  g.spots.forEach(sp => sp.r *= k); m(g.shoulders, ['size']); m(g.arms, ['upper', 'fore', 'thick']);
  m(g.legs, ['upper', 'lower', 'thick']); m(g.feet, ['size']); m(g.wings, ['span']); m(g.tail, ['seg', 'thick']);

// Cuerpo de un monstruo según su etapa.
// Al crecer conserva todo lo que ya tenía (agrandado) y sólo se sortea si le aparecen partes nuevas.
// legacy = monstruos adultos de antes de este sistema: conservan el cuerpo que ya tenían.
// v3 = monstruos nuevos (gen 3): partes y colores extra. Los antiguos no cambian de aspecto.
// Cría: cada grupo de partes del hijo sale del monstruo "origen" de uno de sus padres (rec.genes[grupo] = {seed, legacy, v3});
// los grupos que no están (mutación) salen de su propia semilla. Como el origen se calcula en la misma etapa, al crecer conserva todo.
const GENE_GROUPS = { pal: ['pal', 'pattern'], head: ['head'], eyes: ['eyes'], mouth: ['mouth'], horns: ['horns'], ears: ['ears', 'antennae'],
  neck: ['neck'], body: ['torso', 'spots', 'shoulders'], arms: ['arms'], legs: ['legs', 'feet'], wings: ['wings'], tail: ['tail'] };

  const g = genGenome(rec.seed, stage, rec.legacy, (rec.gen || 0) >= 3);
  if (!rec.genes) return g;
  const cache = {};
  for (const [grp, keys] of Object.entries(GENE_GROUPS)) {
    const src = rec.genes[grp]; if (!src) continue;
    const id = `${src.seed}:${src.legacy ? 1 : 0}${src.v3 ? 1 : 0}`;
    const pg = cache[id] || (cache[id] = genGenome(src.seed, stage, src.legacy, src.v3));
    for (const k of keys) g[k] = pg[k] == null ? pg[k] : JSON.parse(JSON.stringify(pg[k]));

  const n = g.eyes.count, maxR = n <= 1 ? 0.5 : n === 2 ? 0.34 : n === 3 ? 0.3 : 0.24;

}

  const g = baseGenome(seed, stage, legacy);

}

// Variedad: mismo seed = mismas elecciones en todas las etapas (sale de un flujo aparte)
function applyVariety(g, seed) {
  const r = rng((seed ^ 0x5f3759df) >>> 0);

    case 'pastel': Object.assign(P, { body: C(hue, 38 + 18 * f[0], 72 + 8 * f[1]), belly: C(hue, 30, 88), accent: C(h2, 50 + 20 * f[2], 74), limb: C(hue + 10, 35, 66), wing: C(h2 + 25, 50, 80), horn: C(h2, 30, 86), spot: C(h2, 45, 82) }); break;

    case 'dark': Object.assign(P, { body: C(hue, 28 + 30 * f[0], 22 + 8 * f[1]), belly: C(hue, 25, 38), accent: C(h2, 90, 60), limb: C(hue, 30, 17), wing: C(h2, 55, 34), horn: C(h2, 70, 66), spot: C(h2, 80, 55) });
      if (f[2] < 0.5) { P.sclera = C(h2, 95, 70); P.pupil = C(h2, 30, 8); } break; // ojos que brillan
    case 'earthy': { const eh = [25, 35, 45, 95, 120, 15][Math.floor(f[0] * 6)]; Object.assign(P, { body: C(eh, 30 + 15 * f[1], 38 + 10 * f[2]), belly: C(eh + 10, 30, 65), accent: C(eh + 40, 40, 52), limb: C(eh, 30, 32), wing: C(eh + 60, 35, 48), horn: C(40, 25, 82), spot: C(eh, 30, 28) }); break; }
    case 'metal': if (f[0] < 0.5) Object.assign(P, { body: C(45, 72, 52), belly: C(48, 80, 72), accent: C(205, 18, 78), limb: C(42, 65, 44), wing: C(205, 15, 82), horn: C(205, 12, 90), spot: C(40, 70, 38) });

    case 'candy': Object.assign(P, { body: C(hue, 75, 68), belly: C(hue, 60, 86), accent: C(hue + 180, 80, 70), limb: C(hue + 15, 70, 62), wing: C(hue + 200, 70, 80), horn: C(0, 0, 97), spot: C(0, 0, 97) }); break;

  const patLight = r.chance(0.5);

function baseGenome(seed, stage, legacy) {
  if (stage === 'egg') stage = 'baby';
  if (stage === 'awakened') stage = 'adult'; // awakened = mismo cuerpo de adulto + aura y ultimate
  if (legacy || stage === 'baby') return rollGenome(seed, stage);
  const child = growFrom(rollGenome(seed, 'baby'), 'child', seed);
  if (stage === 'child') return child;
  const teen = growFrom(child, 'teen', seed);
  return stage === 'teen' ? teen : growFrom(teen, 'adult', seed);
}

function growFrom(prev, stage, seed) {
  const fresh = rollGenome(seed, stage);                 // candidatos para las partes nuevas de esta etapa
  const r = rng((seed ^ ({ child: 0x3c6ef372, teen: 0x27d4eb2f }[stage] || 0x165667b1)) >>> 0);
  const k = STAGE_LIM[stage].size / STAGE_LIM[prev.stage].size * r.f(0.95, 1.1); // cuánto crece
  const g = JSON.parse(JSON.stringify(prev));
  scaleGenome(g, k);
  g.stage = stage; g.name = fresh.name;
  // El bebé era una sola pieza: ahora le sale torso; su cuerpo de bebé pasa a ser la cabeza
  if (g.blob) { delete g.blob; g.torso = fresh.torso; g.spots = fresh.spots; }
  else {
    const T = g.torso;
    if (!T.mid && fresh.torso.mid) T.mid = { w: clamp(T.upper.w * r.f(0.8, 1.2), 30, 82), h: fresh.torso.mid.h };
    if (!T.lower && fresh.torso.lower) T.lower = { w: clamp(T.upper.w * r.f(0.8, 1.25), 28, 82), h: fresh.torso.lower.h };
    if (!g.spots.length && fresh.spots.length) g.spots = fresh.spots;
  }
  // Partes que puede ganar: si ya las tenía las conserva (y su cantidad sólo puede subir)
  const keepOrNew = (key, countKey, max) => {
    if (prev[key][countKey] > 0) g[key][countKey] = Math.min(max, Math.max(g[key][countKey], fresh[key][countKey]));
    else g[key] = fresh[key];
  };
  keepOrNew('arms', 'pairs', 3); keepOrNew('legs', 'pairs', 2); keepOrNew('wings', 'pairs', 2);
  keepOrNew('horns', 'count', 4); keepOrNew('tail', 'count', 3);
  if (prev.tail.count > 0) g.tail.segs = Math.max(g.tail.segs, Math.min(8, g.tail.segs + r.i(0, 2)));
  if (!(prev.legs.pairs > 0)) g.feet = fresh.feet;
  if (!(prev.neck.len > 0)) g.neck = fresh.neck; else g.neck.len = Math.max(g.neck.len, fresh.neck.len);
  if (!(prev.shoulders.size > 0)) g.shoulders = fresh.shoulders;
  // Ojos: conserva los suyos y a veces le sale uno más
  if (fresh.eyes.count > g.eyes.count && g.eyes.count < 6 && r.chance(0.3)) {
    const n = g.eyes.count + 1, y = g.eyes.pos.length ? g.eyes.pos.reduce((a, p) => a + p[1], 0) / g.eyes.pos.length : -0.15;
    const maxR = n <= 1 ? 0.5 : n === 2 ? 0.34 : n === 3 ? 0.3 : 0.24;
    g.eyes.count = n; g.eyes.pos = eyeLayout(n, y, 0.44);
    g.eyes.size = Math.max(3.5, Math.min(g.eyes.size, g.head.w / 2 * maxR, g.head.h / 2 * 0.42));
  }
  return g;
}

function rollGenome(seed, stage = 'adult') {

    belly: C(hue + r.f(-20, 20), sat * 0.55, Math.min(86, lit + r.f(16, 28))),
    accent: C(h2, r.f(45, 85), r.f(45, 62)),
    limb: r.chance(0.3) ? C(h2, sat, lit) : C(hue + r.f(-10, 10), sat, lit - r.f(0, 8)),
    horn: r.chance(0.5) ? C(40, r.f(15, 35), r.f(80, 90)) : C(h2, r.f(25, 55), r.f(22, 40)),
    wing: C(h2 + r.f(-25, 25), r.f(40, 80), r.f(42, 66)),
    sclera: r.chance(0.75) ? C(50, 20, 97) : C(r.f(0, 360), r.f(50, 90), r.f(72, 86)),
    pupil: r.chance(0.7) ? C(250, 30, 8) : C(r.f(0, 360), r.f(70, 100), r.f(38, 52)),
    spot: C(hue + r.f(-30, 30), sat, lit + (r.chance(0.5) ? 14 : -14)),

  // Cabeza
  const head = { shape: r.pick(['round', 'wide', 'tall', 'square', 'tri', 'pear']), w: r.f(32, 60), h: r.f(28, 52) };
  if (head.shape === 'round') head.h = head.w * r.f(0.9, 1.05);
  if (head.shape === 'wide') { head.w *= 1.15; head.h *= 0.85; }
  if (head.shape === 'tall') { head.w *= 0.85; head.h *= 1.15; }

  // Ojos y pupilas
  const ecount = r.w(L.eyes);
  const eyeY = r.f(-0.35, 0.02);
  const maxR = ecount <= 1 ? 0.5 : ecount === 2 ? 0.34 : ecount === 3 ? 0.3 : 0.24;
  const eyes = {
    count: ecount,
    size: Math.max(3.5, Math.min(r.f(5, 14), hw * maxR, hh * 0.42)),
    pos: eyeLayout(ecount, eyeY, r.f(0.36, 0.52)),
    pupils: r.w({ 0: 5, 1: 85, 2: 10 }),
    pupilShape: r.pick(['round', 'round', 'slit', 'bar', 'dot', 'ring', 'star']),
    pupilSize: r.f(0.38, 0.72),
    lid: r.chance(0.25), lidAng: r.f(-0.5, 0.5),
  };

  const mouth = { type: r.w({ none: 5, smile: 18, fangs: 20, open: 16, beak: 10, teeth: 16, tusks: 8 }), w: r.f(0.3, 0.72), y: clamp(eyeY + 0.55 + r.f(0, 0.2), 0.3, 0.7) };
  const horns = { count: r.w(L.horns), len: r.f(10, 34), width: r.f(4, 10), curve: r.f(-0.6, 0.6), spread: r.f(0.25, 0.9) };
  const nl = r.w(L.neck);
  const neck = { len: nl === 0 ? 0 : nl === 1 ? r.f(6, 16) : r.f(18, 34), w: r.f(10, 20) };

  // Torso: superior / medio / inferior (medio e inferior pueden no existir)
  const upper = { w: r.f(38, 72), h: r.f(22, 36) };
  const mid = r.chance(L.mid) ? { w: clamp(upper.w * r.f(0.7, 1.3), 30, 82), h: r.f(16, 32) } : null;
  const lower = r.chance(L.lower) ? { w: clamp(upper.w * r.f(0.65, 1.35), 28, 82), h: r.f(16, 32) } : null;
  const torso = { upper, mid, lower, shape: r.pick(['oval', 'oval', 'box']), belly: r.chance(0.7) };
  const spots = [];
  if (r.chance(0.35)) {
    const segs = ['upper', mid ? 'mid' : 'upper', lower ? 'lower' : 'upper'];
    for (let i = r.i(3, 8); i > 0; i--) spots.push({ seg: r.pick(segs), u: r.f(-0.6, 0.6), v: r.f(-0.5, 0.5), r: r.f(2, 5) });
  }

  const shoulders = { size: r.chance(L.shoulders) ? r.f(7, 15) : 0, spikes: r.chance(0.25), accent: r.chance(0.4) };
  const arms = { pairs: r.w(L.arms), upper: r.f(14, 30), fore: r.f(14, 30), thick: r.f(5, 12), hand: r.pick(['fist', 'claw', 'blade', 'paw']) };
  const legs = { pairs: r.w(L.legs), upper: r.f(12, 26), lower: r.f(12, 26), thick: r.f(6, 14), spread: r.f(0.35, 0.85) };
  const feet = { size: r.f(6, 14), type: r.pick(['round', 'claw', 'hoof', 'flat']) };
  const wings = { pairs: r.w(L.wings), span: r.f(28, 64), type: r.pick(['bat', 'feather', 'bug']) };
  const tail = { count: r.w(L.tail), segs: r.i(3, 8), seg: r.f(6, 11), thick: r.f(4, 10), tip: r.pick(['none', 'spike', 'ball', 'fin', 'flame']), curl: r.f(0.1, 0.45), side: r.chance(0.5) ? 1 : -1, accent: r.chance(0.35) };

  let name = ''; for (let i = r.i(2, 3); i > 0; i--) name += r.pick(SYL);
  name = name[0].toUpperCase() + name.slice(1);

  const g = { seed, stage, name, pal, head, eyes, mouth, horns, neck, torso, spots, shoulders, arms, legs, feet, wings, tail };
  scaleGenome(g, L.size);
  if (L.blob) { // bebé: una sola pieza de cuerpo que también es la cara
    g.blob = true; g.spots = [];
    g.torso = { upper: { w: g.head.w, h: g.head.h }, mid: null, lower: null, shape: 'oval', belly: false };
  }
  return g;
}

// Las estadísticas salen del cuerpo: más brazos = más fuerza, más alas = más esquiva, etc.
const WEIGHT_SCALE = { adult: 0.885 };
function calcStats(g, level = 1, train = null) {
  const T = g.torso;
  const segs = [T.upper, T.mid, T.lower].filter(Boolean);
  const area = segs.reduce((a, s) => a + s.w * s.h, 0) / 1000;
  const headA = g.head.w * g.head.h / 1000;
  const armP = g.arms.pairs, legP = g.legs.pairs, wingP = g.wings.pairs;
  const armMass = armP * (g.arms.upper + g.arms.fore) * g.arms.thick / 1000 * 2;
  const legMass = legP * (g.legs.upper + g.legs.lower) * g.legs.thick / 1000 * 2;
  let weight = 0.5 + area * 0.32 + headA * 0.25 + armMass * 0.5 + legMass * 0.5 + g.horns.count * g.horns.len * 0.004 + g.tail.count * g.tail.segs * g.tail.thick * 0.004;
  // Peso por etapa: los adultos son grandes y antes casi todos llegaban al tope (3,5). Se escala para que su promedio
  // siga igual (~3,3) pero haya adultos livianos y pesados (≈2,6–4,1). Las otras etapas no cambian.
  weight = clamp(weight * (WEIGHT_SCALE[g.stage] || 1), 0.5, 4.2);
  const hp = 60 + area * 20 + headA * 10 + g.shoulders.size * 0.8;
  const defense = 3 + g.shoulders.size * 0.9 + (g.shoulders.spikes ? 4 : 0) + area * 2 + (T.shape === 'box' ? 4 : 0);
  const legLen = g.legs.upper + g.legs.lower;
  let speed = legP ? 55 + legLen * 1.3 * (legP === 2 ? 1.15 : 1) : 75;
  speed = clamp(speed + wingP * g.wings.span * 0.45 - weight * 14, 40, 190);
  const handB = { fist: 1, claw: 1.2, blade: 1.4, paw: 0.9, pincer: 1.3, tentacle: 1.05 }[g.arms.hand] || 1;
  let melee = armP ? 5 + armP * 1.6 + g.arms.thick * 0.55 * handB + g.arms.fore * 0.08 : 4 + weight * 3;
  melee += g.horns.count * g.horns.len * 0.06 + (['fangs', 'tusks', 'mandibles'].includes(g.mouth.type) ? 1.5 : 0) + (g.tail.count && g.tail.tip === 'stinger' ? 1.5 : 0);
  const reach = armP ? (g.arms.upper + g.arms.fore) * 0.75 * (g.arms.hand === 'tentacle' ? 1.25 : 1) : 8 + (g.horns.count ? g.horns.len * 0.5 : 0) + g.neck.len * 0.3;
  const meleeCd = clamp(0.75 + weight * 0.18 - armP * 0.08, 0.5, 1.6);
  const eyeP = g.eyes.count * g.eyes.size * 0.12 * (g.eyes.pupils ? 1 : 0.6);
  const mouthP = { none: 0, smile: 2, fangs: 2.5, open: 4, beak: 3, teeth: 3, tusks: 2, tongue: 3, mandibles: 2.5, whiskers: 2 }[g.mouth.type] ?? 2;
  let ranged = (eyeP + mouthP) * 0.9;
  if (ranged < 1.2) ranged = 0;
  const rangedSrc = mouthP >= eyeP ? 'mouth' : 'eyes';
  const rangedCd = clamp(2.4 - g.eyes.count * 0.15 - (g.mouth.type === 'open' ? 0.3 : 0), 1.0, 2.6);
  const range = clamp(220 + g.eyes.count * 25 + g.eyes.size * 4 + (g.antennae ? 20 : 0), 200, 440);
  const dodge = clamp(0.12 + wingP * 0.08 + speed / 1000 - weight * 0.025 + (g.tail.count ? 0.03 : 0) + (g.ears ? 0.02 : 0), 0.08, 0.5);
  const lv = 1 + (level - 1) * 0.07;
  const mass = 0.5 + area * 0.32 + headA * 0.25 + armMass * 0.5 + legMass * 0.5 + g.horns.count * g.horns.len * 0.004 + g.tail.count * g.tail.segs * g.tail.thick * 0.004; // peso sin tope (para volar)
  const st = { hp: Math.round(hp * lv), melee: melee * lv, ranged: ranged * lv, defense: defense * (1 + (level - 1) * 0.04), speed, weight, dodge, reach, meleeCd, rangedCd, range, rangedSrc, mass };
  if (train) for (const t of PTS) if (train[t.k]) t.apply(st, Math.min(PTS_MAX, train[t.k]));
  return st;
}

// ----- Entrenamiento por puntos: 4 stats, 2 puntos por nivel para repartir -----
const PTS_PER_LEVEL = 2, PTS_MAX = 20, RESPEC_COST = 50;
const ptsTotal = lvl => 2 + (lvl - 1) * PTS_PER_LEVEL;
const ptsUsed = pts => Object.values(pts || {}).reduce((a, b) => a + b, 0);
const PTS = [
  { k: 'pow', name: 'Poder', desc: '+6% daño de golpe y disparo', apply: (st, n) => { st.melee *= 1 + 0.06 * n; st.ranged *= 1 + 0.06 * n; } },
  { k: 'end', name: 'Aguante', desc: '+5% vida y +1,5 defensa', apply: (st, n) => { st.hp = Math.round(st.hp * (1 + 0.05 * n)); st.defense += 1.5 * n; } },
  { k: 'agi', name: 'Agilidad', desc: '+4 velocidad y +1% esquiva', apply: (st, n) => { st.speed = clamp(st.speed + 4 * n, 40, 260); st.dodge = clamp(st.dodge + 0.01 * n, 0.08, 0.62); } },
  { k: 'tec', name: 'Técnica', desc: 'ataca más seguido (-3%) y llega más lejos', apply: (st, n) => { st.meleeCd *= Math.pow(0.97, n); st.rangedCd *= Math.pow(0.97, n); st.reach *= 1 + 0.03 * n; st.range = Math.min(500, st.range + 8 * n); } },
];
const trainCost = l => 20 + 15 * l; // (sistema anterior: sólo para devolver monedas)
function randomPts(level) { const p = {}; for (let i = ptsTotal(level); i > 0; i--) { const k = PTS[Math.floor(Math.random() * 4)].k; if ((p[k] || 0) < PTS_MAX) p[k] = (p[k] || 0) + 1; } return p; }

// El cuerpo cambia con los puntos (sólo lo visual; los stats ya incluyen el entrenamiento)
function bodyFromTraining(g, pts) {
  if (!pts || !ptsUsed(pts)) return g;
  const c = JSON.parse(JSON.stringify(g)), P = k => Math.min(PTS_MAX, pts[k] || 0);
  const pow = 1 + Math.min(0.45, P('pow') * 0.025), end = 1 + Math.min(0.3, P('end') * 0.016);
  const agiL = 1 + Math.min(0.25, P('agi') * 0.014), agiS = 1 - Math.min(0.12, P('agi') * 0.007), tec = 1 + Math.min(0.22, P('tec') * 0.012);
  c.arms.thick *= pow; c.legs.thick *= 1 + (pow - 1) * 0.5; if (c.shoulders.size > 0) c.shoulders.size *= pow;   // Poder: brazos y hombros
  for (const sg of [c.torso.upper, c.torso.mid, c.torso.lower]) if (sg) sg.w *= end * agiS;                       // Aguante: más ancho / Agilidad: más fino
  if (c.blob) { c.head.w *= end * agiS; c.torso.upper.w = c.head.w; }
  c.legs.upper *= agiL; c.legs.lower *= agiL;                                                                    // Agilidad: piernas largas
  c.eyes.size *= tec;                                                                                             // Técnica: ojos atentos
  return c;
}

// ----- Personalidad: 3 ejes de -1 a 1 -----
const TEMPER = [
  { k: 'agr', pos: 'Agresivo', neg: 'Cauto', posD: 'busca el cuerpo a cuerpo y no retrocede', negD: 'mantiene distancia y se aleja tras golpear' },
  { k: 'terco', pos: 'Terco', neg: 'Oportunista', posD: 'no suelta a su objetivo', negD: 'va por el más débil o el distraído y lo remata con más fuerza' },
  { k: 'valor', pos: 'Valiente', neg: 'Prudente', posD: 'con poca vida pelea más fuerte', negD: 'con poca vida se aleja y esquiva más' },
];
const DRILLS = [ // ejercicios (monedas) que empujan la personalidad
  { k: 'agr', d: 1, name: 'Sparring' }, { k: 'agr', d: -1, name: 'Tiro a distancia' },
  { k: 'terco', d: 1, name: 'Ejercicio de foco' }, { k: 'terco', d: -1, name: 'Lectura del combate' },
  { k: 'valor', d: 1, name: 'Prueba de valor' }, { k: 'valor', d: -1, name: 'Ejercicio de cautela' },
];
const DRILL_COST = 15, DRILL_STEP = 0.1;
const ULT_MODES = { ready: { name: 'Apenas pueda', desc: 'la usa en cuanto lleva 3 golpes en la pelea' }, finisher: { name: 'Como remate', desc: 'la guarda para cuando su objetivo tiene poca vida' }, save: { name: 'Para salvarse', desc: 'la usa cuando él tiene poca vida' } };
function randomTemper(seed) { const r = rng((seed ^ 0x7e3a91c5) >>> 0); return { agr: r.f(-0.3, 0.3), terco: r.f(-0.3, 0.3), valor: r.f(-0.3, 0.3) }; }
const temperLabel = (k, v) => { const t = TEMPER.find(x => x.k === k); return v > 0.25 ? t.pos : v < -0.25 ? t.neg : null; };
function adjustTemper(rec, k, d) { if (!rec.temper) rec.temper = randomTemper(rec.seed); rec.temper[k] = clamp(rec.temper[k] + d, -1, 1); }

function makeCols(P, fl) {
  const H = (c, dl = 0, a = 1) => hsl(c, dl + fl, a);
  return {
    body: H(P.body), bodyL: H(P.body, 5), bodyD: H(P.body, -6), belly: H(P.belly), accent: H(P.accent),
    limb: H(P.limb), limbD: H(P.limb, -12), horn: H(P.horn), wing: H(P.wing), wingD: H(P.wing, -12), wingL: H(P.wing, 12, 0.8),
    sclera: H(P.sclera), pupil: H(P.pupil), spot: H(P.spot),
    two: P.two ? H(P.two, 4) : null, twoD: P.two ? H(P.two, -6) : null, pat: P.pat ? H(P.pat) : null,
    ol: `hsl(${P.body.h.toFixed(0)},${(P.body.s * 0.5).toFixed(0)}%,${(12 + fl * 0.5).toFixed(0)}%)`,
    mouthIn: `hsl(${P.body.h.toFixed(0)},40%,${(10 + fl * 0.4).toFixed(0)}%)`,
    tongue: `hsl(350,70%,${(62 + fl * 0.3).toFixed(0)}%)`, white: '#fffaf0',
  };
}

// ============================================================================
// DIBUJO: helpers
// ============================================================================
function chain(ctx, pts, ws, fill, ol, lw) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = ol;
  for (let i = 0; i < pts.length - 1; i++) { ctx.lineWidth = ws[i] + lw * 2; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke(); }
  ctx.strokeStyle = fill;
  for (let i = 0; i < pts.length - 1; i++) { ctx.lineWidth = ws[i]; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke(); }
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shapePath(ctx, shape, x, y, w, h) {
  ctx.beginPath();
  if (w <= 0 || h <= 0) return;
  if (shape === 'box' || shape === 'square') rrect(ctx, x - w / 2, y - h / 2, w, h, Math.min(w, h) * 0.32);
  else if (shape === 'tri') {
    ctx.moveTo(x, y + h / 2);
    ctx.bezierCurveTo(x - w * 0.35, y + h / 2, x - w * 0.6, y - h * 0.2, x - w * 0.45, y - h * 0.45);
    ctx.quadraticCurveTo(x, y - h * 0.62, x + w * 0.45, y - h * 0.45);
    ctx.bezierCurveTo(x + w * 0.6, y - h * 0.2, x + w * 0.35, y + h / 2, x, y + h / 2);
  } else if (shape === 'pear') {
    ctx.moveTo(x, y - h / 2);
    ctx.bezierCurveTo(x + w * 0.3, y - h / 2, x + w * 0.3, y - h * 0.15, x + w * 0.5, y + h * 0.15);
    ctx.bezierCurveTo(x + w * 0.6, y + h * 0.55, x - w * 0.6, y + h * 0.55, x - w * 0.5, y + h * 0.15);
    ctx.bezierCurveTo(x - w * 0.3, y - h * 0.15, x - w * 0.3, y - h / 2, x, y - h / 2);
  } else if (shape === 'heart') {
    ctx.moveTo(x, y + h / 2);
    ctx.bezierCurveTo(x - w * 0.2, y + h * 0.36, x - w / 2, y + h * 0.12, x - w / 2, y - h * 0.15);
    ctx.bezierCurveTo(x - w / 2, y - h * 0.52, x - w * 0.08, y - h * 0.58, x, y - h * 0.3);
    ctx.bezierCurveTo(x + w * 0.08, y - h * 0.58, x + w / 2, y - h * 0.52, x + w / 2, y - h * 0.15);
    ctx.bezierCurveTo(x + w / 2, y + h * 0.12, x + w * 0.2, y + h * 0.36, x, y + h / 2);
  } else if (shape === 'hex') {
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; const px = x + Math.cos(a) * w / 2, py = y + Math.sin(a) * h / 2; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath();
  } else if (shape === 'mushroom') {
    ctx.ellipse(x, y - h * 0.05, w / 2, h * 0.5, 0, Math.PI, TAU);
    ctx.lineTo(x + w * 0.34, y - h * 0.05);
    ctx.bezierCurveTo(x + w * 0.36, y + h * 0.3, x + w * 0.3, y + h * 0.5, x, y + h * 0.5);
    ctx.bezierCurveTo(x - w * 0.3, y + h * 0.5, x - w * 0.36, y + h * 0.3, x - w * 0.34, y - h * 0.05);
    ctx.closePath();
  } else if (shape === 'bean') {
    ctx.moveTo(x - w / 2, y);
    ctx.bezierCurveTo(x - w / 2, y - h * 0.65, x - w * 0.06, y - h * 0.58, x, y - h * 0.36);
    ctx.bezierCurveTo(x + w * 0.06, y - h * 0.58, x + w / 2, y - h * 0.65, x + w / 2, y);
    ctx.bezierCurveTo(x + w / 2, y + h * 0.62, x - w / 2, y + h * 0.62, x - w / 2, y);
  } else ctx.ellipse(x, y, w / 2, h / 2, 0, 0, TAU);
}
function hornPath(ctx, bx, by, tx, ty, w, curve) {
  const dx = tx - bx, dy = ty - by, L = Math.hypot(dx, dy) || 1, px = -dy / L, py = dx / L;
  const cx = bx + dx * 0.5 + px * curve * L * 0.5, cy = by + dy * 0.5 + py * curve * L * 0.5;
  ctx.beginPath();
  ctx.moveTo(bx - px * w / 2, by - py * w / 2);
  ctx.quadraticCurveTo(cx - px * w * 0.2, cy - py * w * 0.2, tx, ty);
  ctx.quadraticCurveTo(cx + px * w * 0.2, cy + py * w * 0.2, bx + px * w / 2, by + py * w / 2);
  ctx.closePath();
}
function fillStroke(ctx, fill, ol, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = ol; ctx.stroke(); }

// ============================================================================
// MONSTRUO: esqueleto con física de resortes (partes "floaty") + IA de combate
// ============================================================================
// Qué tan "floaty" son las partes: resortes más firmes y que frenan más rápido.
// 1,3 y 1,5 dejan el bamboleo en ~75% del original (medido en 60 peleas).
const RIG_STIFF = 1.3, RIG_DAMP = 1.5;
let MID = 0;
class Monster {
  constructor(rec) {
    this.id = ++MID; this.rec = rec;
    this.g = recGenome(rec, rec.stage || 'adult');
    this.name = rec.name || this.g.name;
    this.level = rec.level || 1;
    this.st = calcStats(this.g, this.level, rec.pts);
    this.hp = this.st.hp;
    { const wg = this.g.wings; this.flyer = wg.pairs ? (this.st.mass / (wg.pairs * wg.span) / ((STAGE_LIM[this.g.stage] || STAGE_LIM.adult).size) >= FLY.loadSplit ? 'leap' : 'float') : null; }
    this.flyCd = FLY.cd * 0.5 + Math.random() * FLY.cdR; this.floatT = 0; this.airT = 0;
    this.cols = makeCols(this.g.pal, 0); this.colsF = makeCols(this.g.pal, 38);
    this.x = 0; this.y = 0; this.z = 0; this.vx = 0; this.vy = 0; this.vz = 0;
    this.gx = 0; this.gy = 0; this.s = 1;
    this.team = 0; this.state = 'free'; this.stT = 0;
    this.target = null; this.targetTimer = 0; this.lockAx = { x: 1, y: 0 };
    this.damageFrom = new Map(); this.recentFrom = new Map(); this.kills = 0; this.commitT = 0; this.stunChain = 0; this.lastStun = -9; this.stunImmune = 0;
    this.meleeCd = Math.random() * 0.5; this.rangedCd = 0.6 + Math.random(); this.dodgeCd = 0;
    this.tp = rec.temper || randomTemper(rec.seed); this.ultMode = rec.ultMode || 'save';
    // estilo: el cuerpo dice si es mejor de lejos o de cerca, y su personalidad (Agresivo/Cauto) lo inclina
    const rp = this.st.ranged > 0 ? clamp(this.st.ranged / (this.st.melee * 0.6) - 1, -1, 1) : -2;
    this.kiter = this.st.ranged > 0 && rp - this.tp.agr * 1.2 > 0;
    this.scaredHp = SCARED_HP * (1 - this.tp.valor * 0.7); // los valientes se asustan mucho más tarde
    this.dmgM = 0; this.dmgR = 0; this.switches = 0; this.minHpF = 1; this.backoff = 0; this.berserkSaid = false;
    this.strafe = Math.random() < 0.5 ? 1 : -1; this.strafeT = 2;
    this.desired = { x: 0, y: 0 }; this.atkDir = { x: 1, y: 0 }; this.atkArm = null; this.strikeExt = 0; this.hitSet = new Set();
    this.walkPh = Math.random() * TAU; this.t = Math.random() * 10; this.look = { x: 0, y: 0 }; this.lookAt = null;
    this.blinkT = 2 + Math.random() * 3; this.blink = 0; this.mouthOpen = 0; this.hurtT = 0;
    this.emo = 'neutral'; this.emoT = 0; this.emoP = 0; this.emoNext = null; this.baseEmo = null; this.winEmo = null;
    this.dead = false; this.deadT = 0; this.alpha = 1;
    this.awakened = rec.stage === 'awakened';
    this.ultType = rec.ult || rec.ultGift || starterUlt(rec.seed); // la ultimate equipada (los hijos traen la de un padre)
    this.g = bodyFromTraining(this.g, rec.pts); // el entrenamiento se nota en el cuerpo
    this.ultReady = this.awakened; // se recarga al empezar cada pelea (una por pelea)
    this.hitsN = 0; this.buffs = { defense: 0, speed: 0, dodge: 0, all: 0 };
    this.aura = []; this.auraAcc = 0; this.auraBoost = 0;
    this.auraCols = [hsl(this.g.pal.body, 22), hsl(this.g.pal.accent, 25), '#fff6d8'];
    const T = this.g.torso;
    this.r = Math.max(16, Math.max(T.upper.w, T.mid ? T.mid.w : 0, T.lower ? T.lower.w : 0) * 0.42);
    this.bubbleR = 0;
    this.buildRig();
    this.bubbleR = this.estSize().h * 0.55;
  }

  // ---------- Construcción del esqueleto ----------
  buildRig() {
    const g = this.g, T = g.torso; const N = this.nodes = []; const I = this.ix = {};
    const add = (p, ox, oy, k, z = 0.35) => { N.push({ p, ox, oy, ax: 0, ay: 0, k, c: 2 * z * Math.sqrt(k), x: 0, y: 0, vx: 0, vy: 0, len: Math.hypot(ox, oy), useT: false, tx: 0, ty: 0, boost: 1 }); return N.length - 1; };
    const lo = T.lower || { w: T.upper.w * 0.8, h: 0 }, mi = T.mid || { w: (lo.w + T.upper.w) / 2, h: 0 }, up = T.upper;
    this.seg = { lo, mi, up };
    this.legSum = g.legs.upper + g.legs.lower;
    this.hover = g.legs.pairs || g.blob ? 0 : 24;

    I.root = add(-1, 0, 0, 0);
    I.lower = add(I.root, 0, -lo.h * 0.5, 420, 0.4);
    I.mid = add(I.lower, 0, -(lo.h + mi.h) * 0.42, 360, 0.35);
    I.upper = add(I.mid, 0, -(mi.h + up.h) * 0.42, 300, 0.3);
    // Cuello (0..n segmentos) y cabeza
    I.neck = []; let par = I.upper;
    const nl = g.neck.len, ns = nl > 0 ? Math.max(1, Math.round(nl / 10)) : 0;
    for (let i = 0; i < ns; i++) { par = add(par, 0, (i === 0 ? -up.h * 0.42 : 0) - nl / ns, 220 - i * 20, 0.28); I.neck.push(par); }
    I.head = g.blob ? add(I.upper, 0, -g.head.h * 0.1, 260, 0.2) : add(par, 0, ns ? -g.head.h * 0.42 : -(up.h * 0.42 + g.head.h * 0.36), 150, 0.25);
    // Cuernos
    I.horns = [];
    const hn = g.horns.count;
    for (let i = 0; i < hn; i++) {
      const u = hn === 1 ? 0 : lerp(-1, 1, i / (hn - 1));
      const bx = u * g.head.w * 0.5 * g.horns.spread, by = -g.head.h * 0.4 * (1 - 0.35 * Math.abs(u));
      const ang = -Math.PI / 2 + u * 0.9;
      I.horns.push({ base: { x: bx, y: by }, tip: add(I.head, bx + Math.cos(ang) * g.horns.len, by + Math.sin(ang) * g.horns.len, 260, 0.3) });
    }
    // Orejas (las de conejo son blandas y caen; las demás se mueven solas de vez en cuando)
    I.ears = [];
    if (g.ears) for (const sd of [-1, 1]) {
      const e = g.ears, len = g.head.h * e.size * (e.type === 'bunny' ? 2.1 : e.type === 'fin' ? 1.2 : 1);
      const bx = sd * g.head.w * 0.31, by = -g.head.h * 0.36, ang = -Math.PI / 2 + sd * (e.type === 'bunny' ? 0.25 : e.type === 'fin' ? 1.0 : 0.45);
      I.ears.push({ sd, base: { x: bx, y: by }, tip: add(I.head, bx + Math.cos(ang) * len, by + Math.sin(ang) * len, e.type === 'bunny' ? 45 : 260, e.type === 'bunny' ? 0.18 : 0.3) });
    }
    // Antenas: dos tramos elásticos
    I.ants = [];
    if (g.antennae) for (let i = 0; i < g.antennae.count; i++) {
      const sd = g.antennae.count === 1 ? 0 : (i ? 1 : -1), len = g.head.h * g.antennae.len, bx = sd * g.head.w * 0.22, by = -g.head.h * 0.46;
      const n1 = add(I.head, bx + sd * len * 0.25, by - len * 0.55, 70, 0.15), n2 = add(n1, sd * len * 0.2, -len * 0.5, 45, 0.12);
      I.ants.push({ sd, i, base: { x: bx, y: by }, chain: [n1, n2] });
    }
    // Hombros
    I.shoulders = [-1, 1].map(sd => add(I.upper, sd * up.w * 0.46, -up.h * 0.18, 380, 0.35));
    // Brazos: brazo (superior) + antebrazo + mano
    I.arms = [];
    for (let p = 0; p < g.arms.pairs; p++) for (const sd of [-1, 1]) {
      let att;
      if (p === 0) att = I.shoulders[sd < 0 ? 0 : 1];
      else {
        const sn = p === 1 ? (T.mid ? I.mid : T.lower ? I.lower : I.upper) : (T.lower ? I.lower : I.mid);
        const sw = sn === I.mid ? mi.w : sn === I.lower ? lo.w : up.w;
        att = add(sn, sd * sw * 0.46, sn === I.upper ? up.h * 0.3 : 0, 380, 0.35);
      }
      const el = add(att, sd * g.arms.upper * 0.45, g.arms.upper * 0.85, 160, 0.25);
      const ha = add(el, sd * g.arms.fore * 0.15, g.arms.fore * 0.97, 120, 0.22);
      I.arms.push({ p, sd, att, el, ha });
    }
    // Piernas: muslo + pierna inferior + pie
    I.legs = [];
    for (let p = 0; p < g.legs.pairs; p++) for (const sd of [-1, 1]) {
      const hx = sd * Math.max(6, lo.w * 0.5 * (p === 0 ? g.legs.spread : g.legs.spread * 0.45));
      const hip = add(I.lower, hx, lo.h * 0.35, 400, 0.4);
      const knee = add(hip, sd * 3, g.legs.upper, 220, 0.3);
      const foot = add(knee, 0, g.legs.lower, 240, 0.35);
      N[knee].useT = N[foot].useT = true;
      I.legs.push({ p, sd, hip, knee, foot, hx, ph: (sd > 0 ? Math.PI : 0) + p * Math.PI / 2 });
    }
    // Alas
    I.wings = [];
    for (let p = 0; p < g.wings.pairs; p++) for (const sd of [-1, 1]) {
      const span = g.wings.span * (p === 0 ? 1 : 0.72);
      const base = add(I.upper, sd * up.w * 0.22, -up.h * 0.25 + p * up.h * 0.45, 400, 0.4);
      const tip = add(base, sd * span * 0.92, -span * (p === 0 ? 0.45 : 0.05), 90, 0.22);
      I.wings.push({ p, sd, base, tip, span });
    }
    // Colas (cadena de segmentos muy blandos)
    I.tails = [];
    for (let i = 0; i < g.tail.count; i++) {
      const sd = g.tail.count === 1 ? g.tail.side : (i === 0 ? -1 : i === 1 ? 1 : 0);
      let pn = add(T.lower ? I.lower : I.mid, sd * lo.w * 0.15, lo.h * 0.2, 400, 0.4);
      const ch = [pn];
      for (let k = 0; k < g.tail.segs; k++) {
        const a0 = 0.6 - k * g.tail.curl;
        const a = sd > 0 ? a0 : sd < 0 ? Math.PI - a0 : Math.PI / 2 + Math.sin(k) * 0.3;
        pn = add(pn, Math.cos(a) * g.tail.seg, Math.sin(a) * g.tail.seg, Math.max(40, 140 - k * 12), 0.2);
        ch.push(pn);
      }
      I.tails.push({ sd, chain: ch });
    }
  }

  // Altura estimada (para encuadrar en la vitrina)
  estSize() {
    const g = this.g, { lo, mi, up } = this.seg;
    const h = (g.legs.pairs ? this.legSum * 0.9 : this.hover) + (lo.h + mi.h + up.h) * 0.84 + g.neck.len + g.head.h + (g.horns.count ? g.horns.len * 0.8 : 0);
    const w = Math.max(up.w, mi.w, lo.w, g.head.w) + (g.arms.pairs ? (g.arms.upper * 0.5 + g.arms.thick) * 2 : 0);
    const ww = g.wings.pairs ? up.w * 0.44 + g.wings.span * 1.9 : 0;
    const tw = g.tail.count ? lo.w * 0.3 + g.tail.segs * g.tail.seg * 1.5 : 0;
    return { h, w: Math.max(w, ww, tw) };
  }

  rootTarget() {
    const lo = this.seg.lo;
    const base = this.g.legs.pairs ? this.gy - (this.legSum * 0.9 - lo.h * 0.15) * this.s : this.gy - this.hover * this.s;
    return { x: this.gx, y: base - this.z };
  }

  resetRig() {
    const N = this.nodes, rt = this.rootTarget();
    N[0].x = rt.x; N[0].y = rt.y;
    for (let i = 1; i < N.length; i++) { const n = N[i], P = N[n.p]; n.x = P.x + n.ox * this.s; n.y = P.y + n.oy * this.s; n.vx = n.vy = 0; }
  }

  // ---------- Aura de Awakened: partículas de su color que suben, sólo al cargar la ultimate y mientras dura su efecto ----------
  auraStep(dt) {
    const s = this.s;
    this.auraBoost = Math.max(0, this.auraBoost - dt);
    if (!this.dead && (this.state === 'ultcharge' || this.ulting || this.buffs.all > 0 || this.growAura)) {
      this.auraAcc += dt * (this.ulting ? 170 : this.auraBoost > 0 ? 80 : 24); // en el acercamiento de cámara sale más densa
      const w = Math.max(this.seg.up.w, this.seg.mi.w, this.seg.lo.w) * 0.55 * s;
      while (this.auraAcc > 1) {
        this.auraAcc--;
        this.aura.push({ x: this.gx + (Math.random() - 0.5) * w * 2, y: this.gy - this.z - Math.random() * 10 * s, vy: -(50 + Math.random() * 50) * s * (this.auraBoost > 0 ? 1.8 : 1),
          life: 1 + Math.random() * 0.9, max: 1.9, r: (0.45 + Math.random() * 0.8) * s, col: this.auraCols[Math.floor(Math.random() * 3)], front: Math.random() < 0.5, ph: Math.random() * TAU });
      }
    }
    for (const q of this.aura) { q.y += q.vy * dt; q.x += Math.sin(this.t * 3 + q.ph) * 12 * dt * s; q.life -= dt; }
    if (this.aura.length) this.aura = this.aura.filter(q => q.life > 0);
  }
  drawAura(ctx, front) {
    for (const q of this.aura) {
      if (q.front !== front) continue;
      const a = clamp(q.life / 0.6, 0, 1) * this.alpha;
      ctx.fillStyle = q.col;
      ctx.globalAlpha = a * 0.25; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * 0.9; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = this.alpha;
  }

  // ---------- Expresiones ----------
  // Prioridad: K.O. > durmiendo > reacción del momento (golpe, ataque, esquiva…) > fin de pelea > asustado (poca vida) > ánimo base
  face() {
    if (this.dead) return 'ko';
    if (this.sleep) return 'sleep';
    if (this.emoT > 0) return this.emo;
    if (this.winEmo) return this.winEmo;
    if (this.hp / this.st.hp < (this.scaredHp ?? SCARED_HP)) return this.tp && this.tp.valor > 0.2 ? 'angry' : 'scared';
    return this.baseEmo || 'neutral';
  }
  setEmo(e, dur, prio = 1, next = null) {
    if (this.emoT > 0 && prio < this.emoP) return;
    this.emo = e; this.emoT = dur; this.emoP = prio; this.emoNext = next;
  }

  // ---------- Animación: define a dónde "quiere" ir cada parte ----------
  animate(dt) {
    const g = this.g, N = this.nodes, I = this.ix, s = this.s;
    this.t += dt; const t = this.t;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.mouthOpen = Math.max(0, this.mouthOpen - dt * 3);
    this.blinkT -= dt; if (this.blinkT < 0) { this.blink = 0.12; this.blinkT = 2 + Math.random() * 3.5; }
    this.blink = this.sleep ? 1 : Math.max(0, this.blink - dt);
    if (this.emoT > 0) { this.emoT -= dt; if (this.emoT <= 0 && this.emoNext) { const [e, d] = this.emoNext; this.setEmo(e, d, 1); } }
    this.auraStep(dt);
    if (this.dead) return;

    const sp = Math.hypot(this.vx, this.vy), moving = clamp(sp / 60, 0, 1);
    this.walkPh += sp * 0.085 * dt;
    const lean = clamp(this.vx / 150, -1, 1);
    const root = N[0], rt = this.rootTarget();
    const bob = g.blob ? Math.abs(Math.sin(this.walkPh * 1.6)) * 10 * moving + Math.abs(Math.sin(t * 3)) * 1.5
      : g.legs.pairs ? Math.abs(Math.sin(this.walkPh)) * 3 * moving + Math.sin(t * 2.2) * 0.8 : Math.sin(t * 2.4) * 4;
    const crouch = this.state === 'windup' ? 4 : 0;
    root.x = rt.x; root.y = rt.y - (bob - crouch) * s;

    N[I.mid].ax = lean * 2; N[I.upper].ax = lean * 4; N[I.upper].ay = Math.sin(t * 2) * 0.8;
    const head = N[I.head]; head.ax = lean * 6; head.ay = 0;
    if (this.face() === 'scared') { head.ax += (Math.random() - 0.5) * 3; N[I.upper].ax += (Math.random() - 0.5) * 1.5; }
    if (!g.arms.pairs && this.atkDir) { // cabezazo si no tiene brazos
      if (this.state === 'windup') { head.ax -= this.atkDir.x * 8; head.ay -= 4; }
      if (this.state === 'strike') { head.ax += this.atkDir.x * 16 * this.strikeExt; head.ay += this.atkDir.y * DEPTH * 10 * this.strikeExt; }
    }

    // Brazos
    for (const a of I.arms) {
      const el = N[a.el], ha = N[a.ha], att = N[a.att];
      const sw = Math.sin(this.walkPh + (a.sd > 0 ? 0 : Math.PI) + a.p * 1.3) * moving;
      el.ax = a.sd * Math.sin(t * 1.6 + a.p) * 1.5; el.ay = sw * 4;
      ha.ax = a.sd * Math.sin(t * 1.6 + a.p + 0.5) * 2; ha.ay = sw * 6;
      if (this.held || this.z > 25) { const fl = Math.sin(t * 15 + a.sd + a.p) * 5; el.ax += a.sd * 3 + fl; el.ay -= 6; ha.ax += a.sd * 5 - fl; ha.ay -= 10 + fl; } // patalea
      ha.useT = false; ha.boost = 1;
      if (this.atkArm === a && (this.state === 'windup' || this.state === 'strike')) {
        const dx = this.atkDir.x, dy = this.atkDir.y * DEPTH, reach = (g.arms.upper + g.arms.fore) * s;
        ha.useT = true; ha.boost = 4;
        if (this.state === 'windup') { ha.tx = att.x - dx * reach * 0.3 + a.sd * 4 * s; ha.ty = att.y - reach * 0.35; }
        else { const e = 0.4 + 0.75 * this.strikeExt; ha.tx = att.x + dx * reach * e; ha.ty = att.y + dy * reach * e + reach * 0.1; }
      }
    }
    // Alas
    this.flapK = (this.flapK || 0) + ((this.z > 8 || this.state === 'leap' || this.floatT > 0 ? 1 : 0) - (this.flapK || 0)) * Math.min(1, dt * 8);
    for (const w of I.wings) {
      const tip = N[w.tip];
      const fly = this.flapK || 0; // 0 en el suelo → 1 volando (saltando o flotando): aletea más rápido y con mucho más recorrido
      const rate = (g.legs.pairs ? 5 : 9) + moving * 6 + (this.state === 'dodge' ? 10 : 0) + fly * 12;
      tip.ay = Math.sin(t * rate + w.p * 0.8) * w.span * (0.35 + 0.55 * fly);
      tip.ax = -w.sd * Math.abs(Math.sin(t * rate)) * w.span * (0.08 + 0.22 * fly);
      tip.boost = 1 + 3 * fly; // en el aire el ala sigue el aleteo con más fuerza (si no, el resorte se queda corto)
    }
    // Colas
    this.earT = (this.earT ?? Math.random() * 3) - dt;
    if (this.earT < 0) { this.earT = 1.5 + Math.random() * 4; const sd = Math.random() < 0.5 ? -1 : 1; for (const e of I.ears) if (e.sd === sd || Math.random() < 0.4) { const n = N[e.tip]; n.vx += e.sd * 140 * s; n.vy -= 60 * s; } }
    for (const a of I.ants) { N[a.chain[1]].ax = Math.sin(t * 2.2 + a.i * 1.3) * 2.5; N[a.chain[0]].ax = Math.sin(t * 1.7 + a.i) * 1.2; }
    for (const tl of I.tails) tl.chain.forEach((ni, k) => { if (!k) return; const n = N[ni]; n.ax = Math.sin(t * 3 + k * 0.7) * k * 0.6 * (tl.sd || 1); n.ay = Math.cos(t * 2.6 + k * 0.7) * k * 0.4; });
    // Piernas: los pies buscan el suelo (o cuelgan si está en el aire)
    for (const L of I.legs) {
      const hip = N[L.hip], knee = N[L.knee], foot = N[L.foot];
      const ph = this.walkPh + L.ph;
      const stride = Math.min(1, sp / 50) * 10 * s;
      const lift = Math.max(0, Math.cos(ph)) * 7 * s * moving;
      const groundY = this.gy - (L.p === 1 ? 4 * s : 0);
      foot.tx = this.gx + L.hx * s * 1.15 + Math.sin(ph) * stride;
      foot.ty = Math.min(groundY - lift, hip.y + this.legSum * s * 0.98);
      knee.tx = (hip.x + foot.x) / 2 + L.sd * 4 * s; knee.ty = (hip.y + foot.y) / 2;
    }
    // Pupilas: miran al objetivo con un poco de retraso
    let lx, ly;
    if (this.lookAt) { const dx = this.lookAt.x - head.x, dy = this.lookAt.y - head.y, d = Math.hypot(dx, dy) || 1; lx = dx / d; ly = dy / d; }
    else if (this.target && !this.target.dead) { const dx = this.target.gx - this.gx, dy = this.target.gy - this.gy, d = Math.hypot(dx, dy) || 1; lx = dx / d; ly = dy / d * 0.6; }
    else { lx = Math.sin(t * 0.7) * 0.5; ly = Math.sin(t * 0.53) * 0.3; }
    const lk = Math.min(1, dt * 6); this.look.x += (lx - this.look.x) * lk; this.look.y += (ly - this.look.y) * lk;
  }

  // ---------- Puntaje de un posible objetivo (más alto = mejor) ----------
  // Cada factor va de 0 a 1 (así funciona igual en todas las etapas); la personalidad cambia los pesos:
  // Agresivo = cercanía · Cauto = se aleja del que le pega fuerte · Terco = rencor y no suelta · Oportunista = vulnerable y distraído ·
  // Valiente = va por el más peligroso · Prudente = lo evita.
  scoreTarget(e, B, allies) {
    const { agr, terco, valor } = this.tp, st = this.st, hpMax = st.hp;
    const d = Math.hypot(e.x - this.x, e.y - this.y);
    const reach = this.kiter ? Math.min(st.range * 0.8, 300) : this.r + e.r + st.reach * 0.85;
    const close = 0.85 / (1 + Math.max(0, d - reach) / Math.max(40, st.speed) * 1.2) + 0.15 * (1 - clamp(d / Math.hypot(ARENA_W, ARENA_D), 0, 1));
    const threat = clamp((this.recentFrom.get(e.id) || 0) / (hpMax * 0.25), 0, 1);  // cuánto le pegó en los últimos segundos
    const grudge = clamp((this.damageFrom.get(e.id) || 0) / (hpMax * 0.5), 0, 1);  // cuánto le ha pegado en toda la pelea
    const onMe = e.target === this ? 1 : 0;
    const hpF = e.hp / e.st.hp, myHit = Math.max(st.melee, st.ranged) * (1 - e.st.defense / (e.st.defense + 40));
    const vuln = clamp((1 - hpF) * 0.7 + (e.hp < myHit * 2.5 ? 0.3 : 0), 0, 1);       // poca vida / lo remata pronto
    const distr = e.target && e.target !== this && !e.target.dead ? 1 : 0;            // peleando con otro
    const team = allies.length ? allies.filter(a => a.target === e).length / allies.length : 0;
    const crowd = B.mode === 'ffa' ? Math.max(0, B.ms.filter(m => !m.dead && m !== this && m.target === e && m.team !== e.team).length - 1) : 0;
    const shield = (e.buffs.defense > 0 ? 1 : e.buffs.dodge > 0 ? 0.5 : 0) + (e.z > FLY.airZ && !(st.ranged > 0) ? 0.8 : 0); // en el aire y no puedo dispararle
    const dps = m => Math.max(m.st.melee / m.st.meleeCd, m.st.ranged > 0 ? m.st.ranged / m.st.rangedCd : 0);
    const danger = dps(e) / (dps(e) + dps(this) + 1e-6);                              // ~0,5 si son parejos
    const pos = v => Math.max(0, v), neg = v => Math.max(0, -v);
    const W = TGT_W;
    const angry = threat * (W.threat + W.threatAgr * agr) + onMe * W.onMe + grudge * (W.grudge + W.grudgeTerco * pos(terco));
    const opp = vuln * (W.vuln + W.vulnOpp * neg(terco)) + distr * (W.distr + W.distrOpp * neg(terco));
    const sc = close * (W.close + W.closeAgr * agr) + angry + opp + team * W.team - crowd * W.crowd - shield * W.shield
      + (danger - 0.5) * (W.dangerValor * valor - W.dangerCauto * neg(agr));
    return { sc, angry, opp };
  }

  // ---------- Física de resortes de las partes ----------
  rigStep(dt) {
    const N = this.nodes, s = this.s, dead = this.dead;
    for (let i = dead ? 0 : 1; i < N.length; i++) {
      const n = N[i], P = n.p >= 0 ? N[n.p] : null;
      if (dead) { n.vy += 900 * dt; const f = Math.exp(-dt * 1.5); n.vx *= f; }
      else {
        const tx = n.useT ? n.tx : P.x + (n.ox + n.ax) * s, ty = n.useT ? n.ty : P.y + (n.oy + n.ay) * s;
        const k = n.k * n.boost * RIG_STIFF, c = n.c * RIG_DAMP * Math.sqrt(n.boost * RIG_STIFF);
        n.vx += (k * (tx - n.x) - c * n.vx) * dt; n.vy += (k * (ty - n.y) - c * n.vy) * dt;
      }
      n.x += n.vx * dt; n.y += n.vy * dt;
      if (P && n.len > 0.5) { // restricción de distancia (los huesos no se estiran infinito)
        const dx = n.x - P.x, dy = n.y - P.y, d = Math.hypot(dx, dy) || 1e-4, L = n.len * s;
        const mn = dead ? L * 0.9 : L * 0.55, mx = dead ? L * 1.1 : L * 1.3;
        if (d > mx || d < mn) {
          let tt = (d > mx ? mx : mn) / d, nx = P.x + dx * tt, ny = P.y + dy * tt;
          if (!dead && d < mn) { // quedó del lado contrario (p. ej. la cabeza bajo el cuello): se empuja hacia donde debe ir, no hacia atrás, para que no se trabe

function makeFoe(ref) {
  const r = newRec(ref.stage);
  r.level = Math.max(1, ref.level + Math.floor(Math.random() * 3) - 1);
  r.pts = randomPts(r.level);
  r.temper = { agr: Math.random() * 1.6 - 0.8, terco: Math.random() * 1.6 - 0.8, valor: Math.random() * 1.6 - 0.8 };
  r.ultMode = ['ready', 'finisher', 'save'][Math.floor(Math.random() * 3)];

}

function startBattle(mode, team) {

  ARENA_W = 600 * zoom;

  const foe = ref => makeFoe(ref);
  const list = [...players];

  else if (mode === '2v2') {

// ---------- Crecimiento: ocurre al volver al menú, con animación a pantalla completa ----------
function newParts(o, n) { // partes que tiene la etapa nueva y no tenía la anterior, en el orden en que aparecen
  const out = [];
  if (o.blob && !n.blob) out.push('torso');
  else { if (!o.torso.mid && n.torso.mid) out.push('mid'); if (!o.torso.lower && n.torso.lower) out.push('lower'); }
  if (!(o.neck.len > 0) && n.neck.len > 0) out.push('neck');
  for (let p = o.legs.pairs; p < n.legs.pairs; p++) out.push('leg:' + p);
  for (let p = o.arms.pairs; p < n.arms.pairs; p++) out.push('arm:' + p);
  if (!(o.shoulders.size > 0) && n.shoulders.size > 0) out.push('shoulders');
  for (let i = o.tail.count; i < n.tail.count; i++) out.push('tail:' + i);
  for (let p = o.wings.pairs; p < n.wings.pairs; p++) out.push('wing:' + p);
  for (let i = o.horns.count; i < n.horns.count; i++) out.push('horn:' + i);
  return out;
}
function partNodes(M, key) {
  const I = M.ix, [k, v] = key.split(':'), p = +v;
  switch (k) {
    case 'torso': return [I.upper, I.mid, I.lower];
    case 'mid': return [I.mid]; case 'lower': return [I.lower];
    case 'neck': return I.neck; case 'shoulders': return I.shoulders;
    case 'leg': return I.legs.filter(L => L.p === p).flatMap(L => [L.knee, L.foot]);
    case 'arm': return I.arms.filter(a => a.p === p).flatMap(a => [a.el, a.ha]);
    case 'wing': return I.wings.filter(w => w.p === p).map(w => w.tip);
    case 'tail': return I.tails[p] ? I.tails[p].chain : [];
    case 'horn': return I.horns[p] ? [I.horns[p].tip] : [];
  }
  return [];
}
function checkGrowth() {
  const elig = r => r && r.stage !== 'egg' && STAGE_ORDER.indexOf(stageForLevel(r.level)) > STAGE_ORDER.indexOf(r.stage);
  const rec = [...(save.monsters.length ? [cur()] : []), ...save.monsters].find(elig);
  if (!rec || scene !== 'home') return false;
  // Si le toca crecer varias etapas, todas van en la misma animación, una tras otra
  const from = STAGE_ORDER.indexOf(rec.stage), to = STAGE_ORDER.indexOf(stageForLevel(rec.level));
  const chain = [new Monster(rec)];
  for (let i = from + 1; i <= to; i++) chain.push(new Monster({ ...rec, stage: STAGE_ORDER[i] }));
  for (const m of chain) m.growAura = m.awakened; // en la animación de despertar el aura se ve como siempre
  for (let i = 1; i < chain.length; i++) chain[i].hidden = new Set(newParts(chain[i - 1].g, chain[i].g));
  chain.forEach(m => m.resetRig());
  const fe = chain[chain.length - 1].estSize(); // encuadre según el tamaño final
  growAnim = { rec, chain, t: 0, k: Math.min(H * 0.48 / fe.h, W * 0.78 / fe.w, 3.5) };
  setGrowStep(0);
  fx.parts = []; fx.label = null;
  scene = 'grow'; touch = null;
  $('home').classList.remove('on'); $('growUI').classList.add('on');
  $('growTitle').textContent = `¡${rec.name} está creciendo!`; $('growOk').hidden = true;
  return true;
}
function setGrowStep(i) {

  G.ne = G.newM.estSize(); G.ratio = Math.min(1, G.oldM.estSize().h / G.ne.h);
}
function growStep(dt) {
  const G = growAnim, acc = hsl(G.newM.g.pal.accent, 15), name = G.rec.name;
  G.t += dt; fxStep(dt);
  const ease = e => 1 + 2.2 * Math.pow(e - 1, 3) + 1.2 * Math.pow(e - 1, 2); // rebote al final
  const last = G.step === G.chain.length - 2;

    const sh = clamp((pt - dur * 0.3) / (dur * 0.65), 0, 1);
    G.oldM.gx = (Math.random() - 0.5) * 12 * sh;
    if (Math.random() < sh * 0.35) burst((Math.random() - 0.5) * 80, -Math.random() * 90, 1, acc, 120, [2, 4]);
    if (pt >= dur) { // ¡destello y cambia de cuerpo!

      G.rec.stage = G.newM.rec.stage;
      if (G.rec.stage === 'awakened' && !G.rec.ult) { G.rec.ult = G.newM.ultType; grantUlt(G.rec.ult); } // ultimate de regalo al despertar
      if (G.rec.stage === 'awakened' && !G.rec.awakeCounted) { G.rec.awakeCounted = true; G.newSlot = slotCap() < MAX_MONSTERS; save.slots = Math.min(MAX_MONSTERS, slotCap() + 1); } // +1 espacio para monstruos

        if (G.rec.stage === 'awakened') G.newM.auraBoost = 2.5;
        if (last) { G.phase = 'done'; $('growOk').hidden = false; }

}

  const G = growAnim, M = G.phase === 'old' ? G.oldM : G.newM, pal = M.g.pal;
  const cx = W / 2, gy = H * 0.74, k = G.k, cy = gy - G.ne.h * k * 0.5;

function finishBattle() {
  const rank = battle.ranking, nTeams = rank.length, place = rank.indexOf(0) + 1;
  const [bx, bc] = (REWARDS[battle.mode] || REWARDS['1v1'])[place - 1];
  const lines = battle.players.map(pm => {
    const rec = pm.rec, xp = bx + pm.kills * 10, coins = bc + pm.kills * 5;
    rec.xp += xp; save.coins += coins;
    place === 1 ? rec.wins++ : rec.losses++;
    // vidas: sólo se pierde una si lo noquearon
    let lifeTxt = '';
    if (pm.dead) {
      rec.lives = Math.max(0, rec.lives - 1);
      rec.sadUntil = Date.now() + LOSS_SAD_MS; delete rec.happyUntil; // perder un corazón lo deja triste un rato (aunque su equipo gane)
      if (rec.lives === 0) { rec.restUntil = Date.now() + REST_MS; lifeTxt = `<br>Lo noquearon y se quedó sin vidas ${hearts(0)}<br>Descansará ${REST_MS / 60000} min antes de volver a pelear.`; }
      else lifeTxt = `<br>Lo noquearon: pierde una vida ${hearts(rec.lives)}`;
    }
    let ups = 0; while (rec.xp >= xpNeed(rec.level)) { rec.xp -= xpNeed(rec.level); rec.level++; ups++; }
    // sus peleas moldean su personalidad
    const ch = [], tw = (k, d, lbl) => { adjustTemper(rec, k, d); ch.push(lbl); };
    if (pm.dmgM + pm.dmgR > 0) { if (pm.dmgR > pm.dmgM * 1.2) tw('agr', -0.03, 'más Cauto'); else if (pm.dmgM > pm.dmgR * 1.2) tw('agr', 0.03, 'más Agresivo'); }
    if (!pm.dead && pm.minHpF < 0.25) tw('valor', 0.04, 'más Valiente'); else if (pm.dead) tw('valor', -0.03, 'más Prudente');
    if (pm.switches >= 2) tw('terco', -0.03, 'más Oportunista'); else if (pm.switches === 0 && place === 1) tw('terco', 0.02, 'más Terco');
    lifeTxt += (ups ? `<br>¡Subió a <b>nivel ${rec.level}</b>! +${ups * PTS_PER_LEVEL} puntos de entrenamiento` : '') + (ch.length ? `<br><small>Personalidad: ${ch.join(', ')}</small>` : '');
    ups = 0;
    return `${esc(rec.name)} gana <b>+${xp} XP</b> y <b>+${coins} monedas</b>${pm.kills ? ` (${pm.kills} K.O.)` : ''}.` + lifeTxt + (ups ? `<br>¡Subió a <b>nivel ${rec.level}</b>!` : '');
  });
  wakeUp();
  const incub = save.monsters.filter(m => m.readyAt > Date.now());
  if (place === 1 && incub.length) { // ganar adelanta un poquito la incubación de los huevos criados
    for (const m of incub) m.readyAt = Math.max(Date.now(), m.readyAt - INCUBATE_FIGHT_MS);
    const ready = incub.some(m => m.readyAt <= Date.now());
    lines.push(`<small>🥚 ${incub.length > 1 ? 'Tus huevos incubaron' : 'Tu huevo incubó'} ${INCUBATE_FIGHT_MS / 60000} min más rápido${ready ? ': ¡ya se puede abrir!' : ''}</small>`);
  }
  persist(); // si ya puede crecer, crece recién al volver al menú (ver checkGrowth)
  $('resTitle').textContent = battle.timedOut ? '¡Se acabó el tiempo!' : nTeams === 2 ? (place === 1 ? '¡Victoria!' : 'Derrota') : (place === 1 ? '¡1.er lugar!' : PLACE_NAME[place - 1]);
  $('resTitle').className = place === 1 ? 'win' : place === nTeams ? 'lose' : 'mid';
  $('resText').innerHTML = lines.join('<br><br>');
  $('resAgain').disabled = battle.mode === '2v2' ? !(save.monsters.filter(canFight).length >= 2 || canFight(cur())) : !canFight(cur());
  $('result').classList.add('on');
}
